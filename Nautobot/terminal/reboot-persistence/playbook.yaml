---
- name: Bounded Nautobot reboot persistence qualification
  hosts: inventory_automation
  gather_facts: false
  become: true
  vars:
    reboot_user:
      - /usr/sbin/runuser
      - --user
      - nautobot
      - --
      - /usr/bin/env
      - XDG_RUNTIME_DIR=/run/user/999
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/999/bus
  pre_tasks:
    - name: Require exact authorized single host
      ansible.builtin.assert:
        that:
          - reboot_verified | default(false)
          - reboot_execution_authorized | default(false)
          - inventory_hostname == 'j2-svpi4mf'
          - ansible_play_hosts_all | length == 1
          - reboot_root is match('^/tmp/nautobot-reboot\.[0-9a-f]{32}$')
    - name: Reject retained stage
      ansible.builtin.stat:
        path: '{{ reboot_root }}'
      register: existing
    - name: Require unused stage
      ansible.builtin.assert:
        that: not existing.stat.exists
    - name: Stage observers
      ansible.builtin.include_tasks: reboot-stage.yaml
    - name: Collect before
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - '{{ reboot_root }}/reboot-node.py'
          - --root
          - '{{ reboot_root }}'
          - before
        chdir: /
      changed_when: false
    - name: Verify before proxy and monitoring reachability
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - '{{ reboot_bundle }}/reboot-access.py'
          - --output
          - '{{ reboot_evidence }}/access-before.json'
      delegate_to: localhost
      become: false
      changed_when: false
  tasks:
    - name: Reboot once and compare without automatic repair
      block:
        - name: Quiesce and compare before reboot
          ansible.builtin.include_tasks: reboot-quiesce.yaml
          vars:
            reboot_phase: before
        - name: Preserve controller receipts
          ansible.builtin.fetch:
            src: '{{ reboot_root }}/{{ item }}.json'
            dest: '{{ reboot_evidence }}/'
            flat: true
          loop:
            - before
            - drain-before
            - logical-before
            - logical-before-verified
        - name: Durably record one reboot intent
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - '{{ reboot_bundle }}/reboot-bundle.py'
              - arm
              - --evidence
              - '{{ reboot_evidence }}'
            chdir: /
          changed_when: false
          delegate_to: localhost
          become: false
        - name: Disable automatic repair before ambiguous transport
          ansible.builtin.set_fact:
            reboot_resume_required: false
            reboot_attempted: true
        - name: Request exactly one reboot
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - reboot
            chdir: /
          changed_when: true
          failed_when: false
          ignore_unreachable: true
          register: reboot_request
        - name: Reset old connection
          ansible.builtin.meta: reset_connection
        - name: Wait bounded SSH return
          ansible.builtin.wait_for_connection:
            delay: 10
            timeout: 600
            connect_timeout: 5
            sleep: 5
        - name: Read returned boot identity
          ansible.builtin.command:
            argv:
              - /usr/bin/cat
              - /proc/sys/kernel/random/boot_id
            chdir: /
          changed_when: false
          register: returned_boot
        - name: Require changed boot before restaging
          ansible.builtin.assert:
            that: returned_boot.stdout | trim != reboot_original_boot
        - name: Restage frozen observers only
          ansible.builtin.include_tasks: reboot-stage.yaml
        - name: Restore preboot comparison receipts
          ansible.builtin.copy:
            src: '{{ reboot_evidence }}/{{ item }}.json'
            dest: '{{ reboot_root }}/{{ item }}.json'
            owner: root
            group: root
            mode: '0600'
          loop:
            - before
            - logical-before
        - name: Collect automatic
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -B
              - '{{ reboot_root }}/reboot-node.py'
              - --root
              - '{{ reboot_root }}'
              - automatic
            chdir: /
          changed_when: false
        - name: Preserve controller receipts
          ansible.builtin.fetch:
            src: '{{ reboot_root }}/{{ item }}.json'
            dest: '{{ reboot_evidence }}/'
            flat: true
          loop:
            - automatic
        - name: Verify automatic proxy and monitoring reachability
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - '{{ reboot_bundle }}/reboot-access.py'
              - --output
              - '{{ reboot_evidence }}/access-automatic.json'
          delegate_to: localhost
          become: false
          changed_when: false
        - name: Compare after automatic startup
          ansible.builtin.include_tasks: reboot-quiesce.yaml
          vars:
            reboot_phase: after
        - name: Preserve controller receipts
          ansible.builtin.fetch:
            src: '{{ reboot_root }}/{{ item }}.json'
            dest: '{{ reboot_evidence }}/'
            flat: true
          loop:
            - drain-after
            - logical-after
            - logical-after-verified
      always:
        - name: start writers
          ansible.builtin.command:
            argv: '{{ reboot_user + ["/usr/bin/systemctl", "--user", "start", "nautobot-" + item + ".service"] }}'
            chdir: /
          changed_when: true
          loop:
            - worker
            - web
            - scheduler
          when: reboot_resume_required | default(false)
          failed_when: false
          ignore_unreachable: true
          register: resumed
        - name: Collect final
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -B
              - '{{ reboot_root }}/reboot-node.py'
              - --root
              - '{{ reboot_root }}'
              - final
            chdir: /
          changed_when: false
          when: reboot_resume_required | default(false)
          failed_when: false
          ignore_unreachable: true
          register: final_health
        - name: Preserve controller receipts
          ansible.builtin.fetch:
            src: '{{ reboot_root }}/{{ item }}.json'
            dest: '{{ reboot_evidence }}/'
            flat: true
          loop:
            - before
            - drain-before
            - logical-before
            - logical-before-verified
            - automatic
            - drain-after
            - logical-after
            - logical-after-verified
            - final
          failed_when: false
          ignore_unreachable: true
          register: collected
        - name: Record recovery without asserting acceptance
          ansible.builtin.copy:
            content: '{{ {"attempted": reboot_attempted | default(false), "resume_required": reboot_resume_required | default(false),
              "resumes": resumed, "health_rc": final_health.rc | default(-1), "collection": collected, "accepted": false}
              | to_nice_json }}'
            dest: '{{ reboot_evidence }}/recovery.json'
            mode: '0600'
          delegate_to: localhost
          become: false
        - name: Verify final proxy and monitoring reachability
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - '{{ reboot_bundle }}/reboot-access.py'
              - --output
              - '{{ reboot_evidence }}/access-final.json'
          delegate_to: localhost
          become: false
          changed_when: false
          when: reboot_resume_required | default(false)
          register: final_access
          failed_when: false
        - name: Require recovery and complete receipts
          ansible.builtin.assert:
            that:
              - reboot_resume_required | default(false)
              - final_health.rc | default(-1) == 0
              - resumed.results | default([]) | selectattr("rc", "equalto", 0) | list | length == 3
              - collected.results | selectattr("dest", "defined") | list | length == 9
              - final_access.rc | default(-1) == 0
