  populated_media: blocked
  metadata: collect_versions_and_images_before_writer_stop
  snapshot_tag: nautobot-recurring
  retention_delete: false
  staging_disposal:
    implementation_status: local_regressions_passed_target_qualification_pending
    successful_payload: remove_only_after_snapshot_identity_integrity_and_writer_health_verified
    failed_or_interrupted_payload: retain_for_explicit_operator_review
    evidence: retain_sanitized_receipts_outside_payload
    safety: exact_owned_run_root_no_symlinks_no_active_run_under_run_lock
    exhaustion: refuse_new_capture_without_deleting_unreviewed_payloads
credentials:
  provider: doppler
  proposed_project: homelab-dev
  proposed_config: prd_nautobot_backup
  service_token_access: read_only
  bootstrap: protected_service_account_file_outside_git
  expires_at: required_at_deployment
  token_lifetime_days: 90
  rotation_lead_days: 14
  rotation_owner: homelab_operator
  token_file: /var/lib/nautobot/protection/credentials/doppler-service-token
  token_mode: '0600'
  inherited_unrelated_secrets: forbidden
  provisioning_authorized: false
  canonical_references:
    NAUTOBOT_RESTIC_REPOSITORY_PASSWORD: homelab-dev/prd_restic/NAUTOBOT_RESTIC_REPOSITORY_PASSWORD
    NAUTOBOT_RESTIC_B2_APPLICATION_KEY_ID: homelab-dev/prd_b2/NAUTOBOT_RESTIC_B2_APPLICATION_KEY_ID
    NAUTOBOT_RESTIC_B2_APPLICATION_KEY: homelab-dev/prd_b2/NAUTOBOT_RESTIC_B2_APPLICATION_KEY
notifications:
  method: direct_apprise_interim_user_selected
  format_owner: Caddy/docs/APPRISE_DELIVERY.md
  future_delivery_owner: homelab-notification
  reference_contract: Caddy/docs/APPRISE_DELIVERY.md
  endpoint: http://10.1.3.83:8000/notify/apprise
  producer: nautobot-backup
  application: Nautobot
  network_requests_from_backup: false
  separate_notification_service: true
  notification_failure_changes_backup_result: false
  shared_durable_client: future_work
  caddy_source_allowlist_modification: false
