mutation_boundary:
  - Install only frozen runtime, protected state, nine user-unit links and three enabled
    timers.
  - No packages, credential provisioning, remote deletion/prune, retained-payload
    deletion or monitoring changes.
  - Subsequent nightly captures, full checks, successful-payload disposal and real
    state-change alerts require this exact schedule approval.
acceptance:
  - independent installed file hashes, owner/modes, enabled timer symlinks and exact
    next trigger
  - one actual calendar-triggered complete cycle; timer installation and manual start
    are insufficient
  - all six capture hashes and native dump validation; verified writer resume before
    repository access
  - exact new snapshot and full integrity success; credential cleanup; successful-payload-only
    disposal; independent preserved-tree comparison
  - actual missed-run/failure/recovery notification path with downstream receipt evidence;
    no unapproved production fault injection
  - application health and unchanged PostgreSQL/Redis invocations and boot; no active
    guard or leaked credentials after completion
rollback:
  - Refuse foreign unit/runtime drift; disable three owned timers before removing
    links.
  - Do not remove active recovery; retain runtime/state, all payloads, credentials
    and evidence.
  - Installation failure is terminal even after safe rollback; do not replay the claim.
external_inputs:
  - id: activation_and_first_cycle
    required: Execute after exact approval, outside 03:00-04:00 America/Chicago and
      before the November 5 13:22:47 CST baseline expiry. Observe the next native
      03:20 calendar activation, then read back after completion/04:05 freshness.
  - id: monitoring_owner
    required: Aaron owns existing host/user-manager outage monitoring and credential
      rotation; no monitoring changes authorized.
  - id: maintenance_coordination
    required: Coordinate separately authorized restore and repository maintenance
      with the recurring run lock. Existing scrub admission is an observation, not
      a cross-owner mutex.
unresolved_prerequisites:
  - The exact approved bundle was consumed once; installation and independent readback
    passed on November 4. Do not replay.
  - Observe the first native calendar cycle November 5, 2026 at 03:20 America/Chicago
    and freshness at 04:05; recurring-cycle acceptance remains pending.
  - Verify production dump/capture identities, writer readiness, exact snapshot/full
    integrity, credential cleanup, successful-only disposal and downstream recovery
    receipt.
  - Remote deletion/prune, monthly isolated restore, seven-day pilot acceptance and
    Git publication remain separate.
later_stages:
  - remote snapshot deletion/prune
  - older or failed retained-payload disposal
  - monthly isolated restore operation and schedule
  - populated-media support
  - host reboot/outage recovery
  - workload/headroom and seven-day pilot acceptance
  - Caddy onboarding and authority migration
