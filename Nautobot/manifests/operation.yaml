mutation_boundary:
  - Replace only binding.json, recurring_node.py and recurring_disposal.py; add logical_database.py
    and recurring_logical.py under the accepted runtime. Dependencies first, binding
    last.
  - No timers, unit links, supervisor configuration/state, packages, credentials,
    media permissions, monitoring or retained payloads are changed. No backup, notification
    or remote operation is launched by promotion.
  - Existing nightly cycles continue at 03:20 America/Chicago with the 03:22 latest-start
    cutoff, 450-second capture, 240-second recovery, 1800-second cycle, full integrity
    checks and successful-only payload disposal. Logical receipts remain retained.
acceptance:
  - Independently verify exactly five approved changes, protected ownership/modes,
    unchanged accepted runtime remainder and generated caches.
  - Verify all service invocations/health, boot, persistent links, three active timers,
    supervisor state and all retained/staging trees unchanged.
  - A subsequent native scheduled cycle must separately pass logical reference/specification/dump
    binding, upload/full integrity, writer recovery, reference-preserving disposal
    and notifications. Installation does not accept this cycle or monthly restore.
rollback:
  - "Refuse mutation outside the approved date, 05:00\u201323:00 America/Chicago,\
    \ or on baseline/state/runtime drift or active capture/recovery."
  - On a copy or postcondition failure, require only approved old/new bytes and idle
    recovery; restore original binding first, then original scripts, remove only the
    two exact additions, and verify the original accepted runtime/state/timers.
  - If rollback guards or restoration fail, retain evidence and report manual intervention.
    Never restart writers, disable schedules, delete payloads, repair foreign changes
    or replay a consumed claim.
external_inputs:
  - Existing SSH host-key trust and sudo access for ama@10.1.2.170.
  - Exact original schedule rollback bytes and the published, accepted logical-trial
