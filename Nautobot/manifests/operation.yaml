---
schema_version: 1

operation:
  id: nautobot-storage-diagnostic-v2
  state: definition
  authorization_ready: false
  stage: storage_diagnostic
  target:
    host: j2-svpi4mf
    address: 10.1.2.170
    ssh_user: ama
  architecture:
    plan: Nautobot/docs/NAUTOBOT_DEPLOYMENT_PLAN.md
    decision: Nautobot/docs/STORAGE_REMEDIATION_DECISION.md
  source:
    repository: homelab-server-configs
    base_commit: dd5d86f94897d54e86643e355d48c8680ca1df02

predecessor:
  operation: nautobot-uas-quirk-v3
  terminal_tag: nautobot-uas-quirk-v3-rolled-back-operator-applied
  definition_commit: f5ce8344ab6f4c2035a617cad4684603586b8c9f
  bundle_sha256: 0899f68448ca28696044174c7a55fe68621ffdcc29c274f6782aa15875322336
  result: rolled_back_ambiguous_broad_gate

operator_applied_remediation:
  state: immediately_effective_soak_pending
  quirk_token: usb-storage.quirks=152d:0583:u
  immediate_observations:
    root_source: /dev/sda2
    root_filesystem: ext4
    usb_vendor_id: "152d"
    usb_product_id: "0583"
    usb_driver: usb-storage
    negotiated_link_mbps: 5000
    focused_current_boot_error_count: 0

storage:
  root_device: /dev/sda
  root_source: /dev/sda2
  root_filesystem: ext4
  quirk_token: usb-storage.quirks=152d:0583:u
  usb_vendor_id: "152d"
  usb_product_id: "0583"
  expected_driver: usb-storage
  expected_link_mbps: 5000

collection:
  read_only: true
  privilege_model: ansible_unprivileged_explicit_sudo_n
  current_boot_only: true
  journal_line_limit: 1000
  focused_storage_event_pattern: I/O error|Buffer I/O|EXT4-fs error|uas_eh_|device reset
  preserve_exact_matched_lines: true
  stream_limit_bytes: 8388608
  areas:
    - kernel_command_line
    - root_identity
    - usb_driver_and_link
    - focused_current_boot_storage_events
    - power_and_throttling
    - extended_smart_nvme_health
    - mounted_ext4_metadata_and_error_count
  prohibited:
    - smart_self_test
    - filesystem_check_or_repair
    - block_surface_scan
    - package_change
    - service_change
    - boot_file_change
    - reboot
    - usb_reset

decision:
  state: pending_evidence
  immediate_baseline_only: true
  minimum_24_hour_soak_complete: false
  require_operator_review: true
  require:
    - quirk_token_count_one
    - expected_root_identity
    - usb_storage_driver
    - superspeed_link
    - zero_focused_storage_events_current_boot
    - smart_health_passed
    - zero_smart_media_errors
    - zero_smart_error_log_entries
    - complete_ext4_metadata
    - zero_live_ext4_errors
    - no_power_or_throttling_fault
  boundaries:
    - collection_does_not_complete_24_hour_soak
    - collection_does_not_accept_storage_remediation
    - collection_does_not_authorize_host_baseline_or_nautobot_deployment

evidence:
  local_root_pattern: /tmp/nautobot-storage-diagnostic.*
  directory_mode: "0700"
  file_mode: "0600"
  raw_evidence_in_git: false
  exact_focused_event_lines_recorded_in: kernel.log
  records:
    - manifest
    - topology
    - kernel
    - power
    - smart
    - filesystem
    - diagnostic_summary

authorization:
  command: >-
    /bin/bash Nautobot/ansible/scripts/run-storage-diagnostic.sh execute
    BUNDLE_SHA256
  bundle_algorithm: sha256
  authorized_stage: storage_diagnostic
  mutation_authorized: false
  excluded_stages:
    - storage_remediation_mutation
    - host_baseline_retry
    - host_baseline_rollback
    - filesystem_repair
    - hardware_change
    - package_change
    - nautobot_pilot
    - caddy_onboarding
    - authority_migration
    - semaphore
  blockers:
    - definition_checkpoint_required
    - explicit_read_only_authorization_required
