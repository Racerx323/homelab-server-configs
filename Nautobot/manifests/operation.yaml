provider_acceptance:
  operation: backblaze-b2-s3-compatibility-v1
  terminal_tag: backblaze-b2-s3-compatibility-v1-completed
  archive_commit: 40b2b74b23f4f7b1a0bc212d9daaeb0949531769
  definition_commit: c5935852e1a5089fddd6b23eda5ab8e44d2e4422
  bundle_sha256: 20f1b43840e877c60248fc7dc06525d29124cc78ebcbd8ac8af3648340e39588
  result: s3_credential_compatibility_and_probe_cleanup_accepted

repository:
  provider: backblaze_b2
  transport: s3_compatible
  endpoint: s3.us-west-002.backblazeb2.com
  bucket: theama-homelab-nautobot-restic-prd
  prefix: ""
  url: s3:https://s3.us-west-002.backblazeb2.com/theama-homelab-nautobot-restic-prd/
  expected_format_version: 2
  initialization_owner: nautobot-restic-repository-initialization-v1
  initialized_state: absent_unverified
  repository_id: null

secret_contract:
  repository_password:
    doppler_project: homelab-dev
    doppler_config: prd_restic
    doppler_key: NAUTOBOT_RESTIC_REPOSITORY_PASSWORD
    config_exists: true
    key_exists: true
    generation_owner: operator
    generated_value_allowed_in_git_or_evidence: false
  password_recovery:
    independent_from_doppler: true
    location_confirmed: true
    locator: "Dashlane secure note: Homelab"
    value_allowed_in_git_or_evidence: false
  backblaze_credentials:
    doppler_project: homelab-dev
    doppler_config: prd_b2
    application_key_id_key: NAUTOBOT_RESTIC_B2_APPLICATION_KEY_ID
    application_key_key: NAUTOBOT_RESTIC_B2_APPLICATION_KEY
    values_allowed_in_git_or_evidence: false

preflight:
  state: pending
  implementation_state: reviewed
  procedure: restic/docs/READ_ONLY_PREFLIGHT.md
  playbook: Nautobot/ansible/playbooks/preflight-restic-repository.yaml
  launcher: Nautobot/ansible/scripts/run-restic-repository-preflight.py
  repository_access: read_only
  cache_mode: disabled
  lock_mode: disabled
  require_restic_version: true
  require_execution_user: nautobot
  require_repository_absent_result: true
  repository_absent_exit_code: 10
  ambiguous_failure_action: stop_without_initialization
  secret_delivery: protected_controller_extra_vars_file
  remote_secret_files: transient_mode_0600_owned_by_nautobot
  remote_secret_cleanup: required_on_success_and_failure
  credential_fallback_allowed: false
  evidence_local_root_pattern: /tmp/nautobot-restic-preflight.*
  bundle_domain_separator: nautobot-restic-repository-preflight-bundle-v1
  bundle_inputs:
    - Nautobot/ansible/playbooks/preflight-restic-repository.yaml
    - Nautobot/ansible/scripts/run-restic-repository-preflight.py
    - Nautobot/ansible/scripts/validate-restic-repository-preflight.py
    - Nautobot/ansible/scripts/validate-restic-repository-preflight-launcher.py
    - Nautobot/manifests/operation.yaml
    - Nautobot/schemas/operation.schema.json
    - Nautobot/schemas/repository-initialization.schema.json
    - inventory/prod/hosts.yaml
    - inventory/prod/groups/inventory_automation.yaml
    - inventory/prod/hosts/j2-svpi4mf.yaml
    - restic/docs/READ_ONLY_PREFLIGHT.md
  authorization_ready: true
  execution_authorized: true
  separate_live_authorization_required: true

initialization:
  implementation_state: unimplemented
  repository_version_argument: stable
  expected_repository_format_version: 2
  protected_directory_mode: "0700"
  protected_file_mode: "0600"
  cache_mode: disabled
  command_contract:
    - restic_no_cache_repository_file_password_file_init_repository_version_stable
    - restic_no_cache_no_lock_repository_file_password_file_cat_config
  ordered_actions:
    - verify_exact_operation_and_bundle
    - create_bounded_protected_evidence_directory
    - verify_execution_identity_and_restic_version
    - resolve_secrets_without_output
    - verify_protected_file_modes
    - prove_exact_repository_config_is_absent
    - initialize_repository_once
    - record_mutation_result_before_later_gates
    - read_back_repository_config_without_cache_or_lock
    - verify_format_version_and_repository_id
    - preserve_sanitized_evidence

acceptance:
  require:
    - exact_accepted_provider_identity
    - exact_repository_url
    - execution_user_nautobot
    - reviewed_restic_version
    - repository_password_reference_resolves_without_capture
    - independent_password_recovery_location_confirmed
    - preflight_proves_repository_config_absent
    - initialization_succeeds_exactly_once
    - repository_format_version_2
    - repository_id_is_64_lowercase_hex_characters
    - no_cache_or_lock_created
    - evidence_contains_no_secret_values
  boundaries:
    - initializes_only_the_exact_empty_repository
    - does_not_upload_backup_data
    - does_not_create_or_delete_backblaze_resources
    - does_not_change_doppler_except_separately_authorized_password_provisioning
    - does_not_repair_delete_or_reinitialize_a_repository
    - does_not_authorize_nautobot_deployment

failure_and_recovery:
  before_init: remove_only_proven_owned_local_protected_files
  after_init_attempt: stop_and_retain_evidence_for_manual_classification
  automatic_init_retry: false
  automatic_repository_delete: false
  automatic_bucket_cleanup: false
  automatic_password_rotation: false

evidence:
  local_root_pattern: /tmp/nautobot-restic-initialization.*
  directory_mode: "0700"
  file_mode: "0600"
  raw_evidence_in_git: false
  secret_values_in_evidence: false
  records:
    - bundle_inputs_and_hashes
    - execution_identity_and_restic_version
    - secret_reference_resolution_booleans
    - exact_repository_identity
    - preflight_classification
    - mutation_attempted_and_result
    - repository_format_version_and_id
    - cache_and_lock_absence
    - protected_path_modes
    - sanitized_decision_summary

successor:
  stage: backup_restore_verification
  contract: Nautobot/docs/ISOLATED_BACKUP_RESTORE.md
  activation_requires_separate_definition_and_authorization: true

authorization:
  command: null
  bundle_algorithm: sha256
  authorized_stage: restic_repository_initialization
  mutation_authorized: false
  excluded_stages:
    - backup_restore_verification
    - snapshot_forget_or_prune
    - repository_repair
    - repository_deletion
    - nautobot_pilot
    - caddy_onboarding
    - authority_migration
    - semaphore
  blockers:
    - restic_version_and_execution_identity_preflight_required
    - reviewed_execution_implementation_required
    - definition_checkpoint_required
    - final_bundle_hash_required
    - explicit_live_authorization_required
