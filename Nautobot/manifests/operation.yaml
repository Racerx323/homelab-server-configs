    and module files stay under qualification/state.
acceptance:
  - All six captured sections independently hash-verified; pg_restore --list validates
    custom dump.
  - Writers healthy after local capture, unchanged PostgreSQL/Redis invocations and
    boot, no upload receipt.
  - Transient credentials removed; payload retained; guard disarmed; no recurring
    schedule enabled.
  - Review native capture and recovery durations against candidate ceilings; local
    tests are not target acceptance.
rollback:
  - Existing independent supervisor quiesces primary before attempting every resume
    and health check.
  - Failure retains recovery units, protected state and payload; no blind retry, recursive
    deletion or token revocation.
  - Lost controller contact does not own node-local recovery; read back terminal state
    before any recovery decision.
