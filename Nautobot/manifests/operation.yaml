mutation_boundary:
  - Preserve the exact completed qualification tree as qualification-retained-51ea37acf9bc; leave its disposed payload
    receipts and every other retained tree in place. Refuse loaded qualification units and any drift.
  - Create a new service-owned qualification directory and staging run with protected files; transfer only frozen
    inputs.
  - Link four temporary qualification/recovery units; run one attended capture-only trial with logical_reference
    enabled. Pause scheduler/web, drain and stop worker, capture six sections and independent logical probes, then
    resume all writers.
  - Retain new logical identities, comparison receipt, dump and six-section payload. Remove temporary credentials
    and, only after verified healthy completion, four runtime unit links.
  - Keep durable runtime, state, schedule timers, notifications, repository snapshots and monitoring unchanged.
    No upload, restore, disposal or durable promotion.
acceptance:
  - Use privileged pre-mutation journal cursor for bounded independent task/service evidence.
  - All capture/task/verification statuses zero; native dump validation and six hashes; whole prepare/pause/resume
    bound at most 450 seconds with unchanged 240-second independent recovery budget.
  - Logical pre-dump and post-capture comparison equal; independently verify reference/specification/dump binding
    and protected retained files; zero labelled logical-helper containers.
  - All application services healthy; unchanged boot/PostgreSQL/Redis invocations, unchanged accepted durable runtime/state/timer
    links; no upload receipt or snapshot creation.
  - Old qualification rename is exact; old staging and retained trees preserved; no transient credentials. Target
    timings remain unaccepted until this trial passes.
rollback:
  - Independent supervisor and guard own termination and writer recovery; attempt every writer resume and native
    health check even after capture failure.
  - Before capture, a failed setup may leave the preserved tree and new protected inputs; retain evidence and report
    residue. Do not rename back over new state or auto-retry.
  - After writer mutation, retain recovery links/state/payload on failure; require independent readback before further
    cleanup. Never disable the accepted nightly schedule or delete retained payloads.
external_inputs:
  - Aaron available November 9, 2026, 10:00–11:00 America/Chicago; admission needs at least 690 seconds remaining.
  - Existing accepted config-scoped Doppler service token and exactly the three canonical backup references; no
    new provisioning.
  - Existing pinned application images, mapped directory-only media, SSH host-key trust and sudo/controller Ansible
    access.
  - Previously retained November 9 observations are expected values, not a fresh target baseline from this preparation;
    preflight refuses state/service/hash drift.
unresolved_prerequisites:
  - ARM64 whole-pause timing, independent helper cleanup and retained logical-reference binding require the separately
    approved target trial.
  - No current recurring snapshot has a retrospectively independent logical reference. Durable promotion and a subsequent
    new accepted snapshot precede monthly restore approval.
later_stages:
  - Durable logical-reference schedule update after trial acceptance
  - New scheduled snapshot and independent reference/upload/integrity acceptance
  - Monthly isolated restore
  - Explicit retained-payload disposal and remote retention deletion
  - Terminal commit/tag/push
