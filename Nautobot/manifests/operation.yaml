  - new protected recovery-qualification tree and two new staging runs
  - two real writer pauses; SIGKILL only the killed-case primary cgroup; deadline-case
    guard stops its primary
  - runtime links for primary/recovery/guard units only
  - two-second marker timer; no nightly/freshness/notification schedule enablement
  - existing Doppler references resolved twice; transient credentials cleaned, no
    provider configuration changes
acceptance:
  - each fault observed after real writer pause
  - independent recovered_failure with all three resume commands and native health
    zero within 240 seconds
  - healthy writers; PostgreSQL/Redis invocations and boot unchanged
  - no capture payload, upload, notification or disposal
  - credential cleanup, inactive qualification units, removed runtime links
  - old evidence and payloads unchanged; prior user/system timer identities unchanged
  - native calendar parsing across DST and bounded disposable timer dispatch
rollback:
  - never replay consumed claim or clear existing latches
  - on failure retain state, staging and recovery units; stop before second trial
  - independent node-local guard/recovery remains responsible; manual intervention
    if recovery fails
  - no automatic deletion, in-place restore or unrelated service action
external_inputs:
  - exact bundle approval
  - attended November 3 17:30-18:30 America/Chicago
  - no concurrent writers/backup/repository maintenance during trials
  - fresh baseline matches sealed preconditions
  - existing read-only Doppler token and canonical three references
later_stages:
  - schedule_enablement
  - remote_deletion_prune
  - older_payload_disposal
  - populated_media_recovery
