---
schema_version: 1

operation:
  id: nautobot-storage-diagnostic-v1
  state: pending
  authorization_ready: true
  stage: storage_diagnostic
  target:
    host: j2-svpi4mf
    address: 10.1.2.170
    ssh_user: ama
  architecture:
    plan: Nautobot/docs/NAUTOBOT_DEPLOYMENT_PLAN.md
    network_owner: homelab-network
  source:
    repository: homelab-server-configs
    base_commit: 6b0e59c260021cd54a6ae8b21e9c5430d5748be5

incident:
  predecessor_operation: nautobot-host-baseline-v3
  terminal_tag: nautobot-host-baseline-v3-manual-intervention
  operation_started_at_utc: 2026-08-25T17:34:25Z
  first_storage_event_at_utc: 2026-08-25T17:37:25Z
  recurrence_observation_start_utc: 2026-08-25T17:37:26Z
  root_device: /dev/sda
  power_path:
    manufacturer: poe_texas
    model: GAT-PiHAT
    standard: ieee_802_3at
    rated_output_watts: 20
  storage_adapter:
    manufacturer: geekworm
    model: X872_V2.0
    host_interconnect: usb_3_0
    maximum_link_gbps: 5
  observed_events:
    - read_io_error
    - uas_device_reset
    - superspeed_usb_reset

collection:
  read_only: true
  privilege_model: ansible_unprivileged_explicit_sudo_n
  stream_limit_bytes: 8388608
  journal_line_limit: 1000
  observation_start_utc: 2026-08-25T17:34:25Z
  areas:
    - uas_usb_topology
    - kernel_context
    - poe_power_and_throttling
    - extended_smart_nvme_health
    - mounted_ext4_metadata
    - recurrence_after_first_event
  prohibited:
    - smart_self_test
    - filesystem_check_or_repair
    - block_surface_scan
    - package_change
    - service_change
    - reboot
    - usb_reset

decision:
  state: pending_evidence
  operator_choice_required: true
  retain_for_observation_requires:
    - smart_health_passed
    - zero_smart_media_errors
    - zero_ext4_error_count
    - no_power_or_throttling_fault
    - no_storage_event_recurrence_after_first_event
    - stable_uas_usb_attachment
    - minimum_24_hour_read_only_observation
  rollback_if:
    - smart_health_failed
    - smart_media_errors_present
    - ext4_errors_present
    - power_or_throttling_fault_present
    - storage_event_recurred
    - uas_usb_attachment_unstable
    - operator_selects_conservative_rollback
  boundaries:
    - retaining_does_not_accept_host_baseline_v3
    - rollback_requires_separate_definition_and_live_authorization
    - hardware_or_transport_remediation_requires_separate_authorization
    - later_acceptance_requires_a_successor_operation

evidence:
  local_root_pattern: /tmp/nautobot-storage-diagnostic.*
  directory_mode: "0700"
  file_mode: "0600"
  raw_evidence_in_git: false
  records:
    - manifest
    - topology
    - kernel
    - power
    - smart
    - filesystem
    - diagnostic_summary

authorization:
  command: >-
    /bin/bash Nautobot/ansible/scripts/run-storage-diagnostic.sh execute
    BUNDLE_SHA256
  bundle_algorithm: sha256
  authorized_stage: storage_diagnostic
  mutation_authorized: false
  excluded_stages:
    - host_baseline_retry
    - host_baseline_rollback
    - hardware_remediation
    - filesystem_repair
    - dual_stack_identity
    - nautobot_pilot
    - caddy_onboarding
    - authority_migration
    - semaphore
  blockers: []
