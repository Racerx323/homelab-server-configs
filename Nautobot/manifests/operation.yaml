mutation_boundary:
  - Create only the absent service-owned qualification tree and new protected staging
    run.
  - Link four named runtime-only user units; arm only the independent guard timer.
  - Pause scheduler and web, drain worker without cancellation, stop worker; capture
    locally; resume worker web scheduler.
  - Remove four runtime links only after verified healthy completion; retain configuration,
    evidence and payload.
  - Ansible owns protected temporary transport/controller files; node-local async
    and module files stay under qualification/state.
acceptance:
  - All six captured sections independently hash-verified; pg_restore --list validates
    custom dump.
  - Writers healthy after local capture, unchanged PostgreSQL/Redis invocations and
    boot, no upload receipt.
  - Transient credentials removed; payload retained; guard disarmed; no recurring
    schedule enabled.
  - Review native capture and recovery durations against candidate ceilings; local
    tests are not target acceptance.
rollback:
  - Existing independent supervisor quiesces primary before attempting every resume
    and health check.
  - Failure retains recovery units, protected state and payload; no blind retry, recursive
    deletion or token revocation.
  - Lost controller contact does not own node-local recovery; read back terminal state
    before any recovery decision.
external_inputs:
  - Run attended inside 03:00-04:00 America/Chicago with at least 690 seconds remaining
    before pause.
  - Existing accepted service-token and canonical sources must remain valid; no new
    credential provisioning.
  - Existing controller Ansible, SSH host-key trust and sudo access.
unresolved_prerequisites:
  - Native capture/drain/resume duration and capacity acceptance require this authorized
    trial.
  - Production fault-injection recovery and B2/Restic access remain unqualified by
    this capture-only trial.
later_stages:
  - Upload and integrity qualification
  - Production forced-termination recovery qualification
  - Notification delivery
  - Successful-payload disposal
  - Recurring schedule enablement
