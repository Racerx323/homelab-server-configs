---
schema_version: 1
kind: inactive_workload_contract
execution_authorized: false
plan_stage: 5
fixture:
  generator: Nautobot/ansible/scripts/make-workload-fixture.py
  namespace: pilot-synthetic
  locations: 10
  devices: 500
  interfaces_per_device: 4
  ip_assignments: 500
  addresses: synthetic_benchmark_range_never_configured_on_network
  import_adapter: native_models_qualified_orchestration_candidate
  real_inventory_comparison: required_before_claiming_representativeness
jobs:
  - id: pilot-import
    behavior: upsert_only_fixture_namespace_and_reject_existing_unowned_objects
    repetitions: 2
    second_run: no_duplicate_objects_or_unexplained_changes
  - id: pilot-export
    behavior: export_fixture_objects_sorted_by_natural_keys_excluding_ids_and_timestamps
    repetitions: 3
    acceptance: identical_normalized_content_hashes_and_expected_counts
  - id: pilot-audit
    behavior: read_only_validate_fixture_counts_interface_ownership_and_ip_assignments
    repetitions: 10
    concurrency: 2
    external_network_access: false
    writes: false
sampling:
  interval_seconds: 5
  maximum_gap_seconds: 15
  metrics:
    - boot_id
    - mem_available_bytes
    - swap_used_bytes
    - swap_in_out_counters
    - cpu_temperature_celsius
    - throttling_flags
    - memory_events_per_service
    - memory_current_and_max_per_service
    - systemd_unit_state
    - diskstats
    - ext4_error_count
    - kernel_storage_errors_since_cursor
  secret_or_command_environment_capture: false
phases:
  - id: idle_before
    minimum_seconds: 900
  - id: import_and_export
    minimum_seconds: 900
    require_all_jobs_complete: true
  - id: jobs_and_backup_overlap
    minimum_seconds: 1800
    require_real_application_backup: true
    backup_requires_separate_authorization: true
  - id: idle_recovery
    minimum_seconds: 900
  - id: final_delayed_error_window
    minimum_seconds: 75
stop_criteria:
  mem_available_below_bytes: 1610612736
  any_oom_or_oom_kill_increment: true
  any_throttling_flag: true
  any_new_usb_reset_storage_error_or_ext4_increment: true
  temperature_above_celsius: 80
  temperature_policy: stop_on_first_sample_stricter_than_sustained_architecture_limit
  unexpected_service_failure: true
  job_error_or_timeout: true
  unexpected_boot_change: true
  missing_sample_coverage: incomplete_stop_test_load
swap_acceptance:
  baseline: median_swap_used_in_final_300_seconds_of_idle_before
  tolerance_bytes: 67108864
  growth_rule: three_consecutive_60_second_medians_increase_and_total_exceeds_tolerance
  recovery_rule: final_300_second_median_not_above_baseline_plus_tolerance
  interpretation: test_threshold_not_architecture_waiver
limits:
  single_job_timeout_seconds: 900
  whole_workload_timeout_seconds: 10800
  collection_stream_bytes: 4194304
cleanup:
  automatic_delete: false
  preserve_on_failure: true
  follow_up_requires_owned_object_manifest: true
acceptance:
  scope: synthetic_pilot_workload_only
  full_application_restore_required_separately: true
  logout_and_reboot_survival_required_separately: true
  dual_stack_and_exposure_required_separately: true
  seven_day_stable_pilot_required_before_authority_or_semaphore: true
