---
- name: Preserve initialized database without starting services
  hosts: j2-svpi4mf
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require exact preservation authorization
      ansible.builtin.assert:
        that:
          - preservation_bundle_verified | default(false) | bool
          - inventory_hostname == 'j2-svpi4mf'
          - ansible_play_hosts_all | length == 1
    - name: Create private node evidence
      ansible.builtin.command:
        argv: [sudo, '-n', /usr/bin/mktemp, '-d', /tmp/nautobot-inspection.XXXXXXXX]
        chdir: /
      register: preservation_node
      changed_when: true
  tasks:
    - name: Stage exact existing preservation helpers
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/scripts/{{ item }}'
        dest: '{{ preservation_node.stdout }}/{{ item }}'
        owner: root
        group: root
        mode: '0600'
      loop: [inspect-retained-database.py, runtime-initialization-node.py, canary-backup.py]
      become: true
    - name: Stage reviewed nonsecret identities
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/operation.json'
        dest: '{{ preservation_node.stdout }}/operation.json'
        owner: root
        group: root
        mode: '0600'
      become: true
    - name: Preserve and independently compare both stopped volume trees
      ansible.builtin.command:
        argv: [sudo, '-n', /usr/bin/python3, '{{ preservation_node.stdout }}/inspect-retained-database.py', preserve, '{{ preservation_node.stdout }}']
        chdir: /
      register: preservation_result
      failed_when: false
      changed_when: true
      no_log: true
    - name: Retain private preservation result even on failure
      ansible.builtin.copy:
        content: '{{ {"rc": preservation_result.rc, "stdout": preservation_result.stdout, "node_evidence": preservation_node.stdout} | to_json }}'
        dest: '{{ preservation_controller }}/preservation.json'
        mode: '0600'
      delegate_to: localhost
      no_log: true
    - name: Require verified copy and stopped state
      ansible.builtin.assert:
        that:
          - preservation_result.rc == 0
          - (preservation_result.stdout | from_json).passed
