---
- name: Bounded owned-session logout qualification
  hosts: j2-svpi4mf
  gather_facts: false
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Require verified bundle and exact scope
      ansible.builtin.assert:
        that:
          - logout_bundle_verified | default(false) | bool
          - logout_operation.operation.stage == 'logout_persistence'
          - logout_operation.operation.target == inventory_hostname
          - ansible_play_hosts_all | length == 1
          - logout_operation.root is match('^/tmp/nautobot-logout\.[0-9a-f]{32}$')
      delegate_to: localhost
      become: false
    - name: Inspect staging boundary
      ansible.builtin.stat:
        path: '{{ logout_operation.root }}'
      register: logout_existing
    - name: Reject reuse of retained evidence
      ansible.builtin.assert:
        that: not logout_existing.stat.exists
    - name: Create protected evidence directory
      ansible.builtin.file:
        path: '{{ logout_operation.root }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Stage exact reviewed reader and operation
      ansible.builtin.copy:
        src: '{{ logout_bundle }}/{{ item }}'
        dest: '{{ logout_operation.root }}/{{ item }}'
        owner: root
        group: root
        mode: '0600'
      loop: [logout-node.py, operation.json]
    - name: Read back staged identities
      ansible.builtin.stat:
        path: '{{ logout_operation.root }}/{{ item }}'
        checksum_algorithm: sha256
      loop: [logout-node.py, operation.json]
      register: logout_staged
    - name: Require exact staged identities
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.checksum == logout_hashes[item.item]
      loop: '{{ logout_staged.results }}'
    - name: Recheck live preconditions before session mutation
      ansible.builtin.command:
        argv: [/usr/bin/python3, '{{ logout_operation.root }}/logout-node.py', --root, '{{ logout_operation.root }}', preflight]
        chdir: /
      changed_when: false
    - name: Require new transient unit names
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, show, '{{ item }}', '--property=LoadState', --value]
      loop: ['{{ logout_operation.test_unit }}', '{{ logout_operation.observer_unit }}']
      register: logout_units
      changed_when: false
      failed_when: logout_units.stdout | trim != 'not-found'
  tasks:
    - name: Qualify owned PAM logout and retain independent evidence
      block:
        - name: Verify primary proxy access in both address families
          ansible.builtin.command:
            argv: [/usr/bin/python3, '-', '{{ item.address }}']
            stdin: '{{ lookup("ansible.builtin.file", logout_bundle + "/startup-network-client.py") }}'
            chdir: /
          delegate_to: logout_proxy
          become: false
          loop:
            - {address: '10.1.2.170', source: '10.1.0.53'}
            - {address: 'fd36:5aa8:6971:1::170', source: 'fd36:5aa8:6971:1::53'}
          register: logout_proxy_probe
          changed_when: false
          failed_when: >-
            logout_proxy_probe.rc != 0 or
            (logout_proxy_probe.stdout | from_json).status != 200 or
            (logout_proxy_probe.stdout | from_json).source != item.source
        - name: Record intent before requesting the operation-owned session
          ansible.builtin.set_fact:
            logout_session_attempted: true
        - name: Open one bounded PAM session without enabling interactive login
          ansible.builtin.command:
            argv:
              - /usr/bin/systemd-run
              - '--unit={{ logout_operation.test_unit }}'
              - --property=User=nautobot
              - --property=PAMName=login
              - --property=Type=exec
              - --property=Restart=no
              - --property=RuntimeMaxSec=120
              - --property=TimeoutStopSec=10
              - --property=StandardOutput=null
              - --property=StandardError=null
              - /usr/bin/sleep
              - '90'
            chdir: /
          changed_when: true
        - name: Prove session ownership by new ID UID PAM service and leader PID
          ansible.builtin.command:
            argv: [/usr/bin/python3, '{{ logout_operation.root }}/logout-node.py', --root, '{{ logout_operation.root }}', identify]
            chdir: /
          changed_when: false
        - name: Close only the operation-owned transient unit
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, stop, '{{ logout_operation.test_unit }}']
            chdir: /
          changed_when: true
        - name: Verify owned session closure and preserve manager session
          ansible.builtin.command:
            argv: [/usr/bin/python3, '{{ logout_operation.root }}/logout-node.py', --root, '{{ logout_operation.root }}', closed]
            chdir: /
          changed_when: false
        - name: Start independent bounded node observer
          ansible.builtin.command:
            argv:
              - /usr/bin/systemd-run
              - '--unit={{ logout_operation.observer_unit }}'
              - --property=Type=exec
              - --property=Restart=no
              - --property=RuntimeMaxSec=420
              - --property=TimeoutStopSec=10
              - --property=UMask=0077
              - --property=StandardOutput=null
              - --property=StandardError=null
              - /usr/bin/python3
              - '{{ logout_operation.root }}/logout-node.py'
              - --root
              - '{{ logout_operation.root }}'
              - observe
            chdir: /
          changed_when: true
        - name: Wait for node-owned terminal receipt without retrying execution
          ansible.builtin.stat:
            path: '{{ logout_operation.root }}/result.json'
          register: logout_terminal
          until: logout_terminal.stat.exists
          retries: 85
          delay: 5
        - name: Read terminal observation
          ansible.builtin.slurp:
            src: '{{ logout_operation.root }}/result.json'
          register: logout_result
        - name: Require complete passing observation
          ansible.builtin.assert:
            that: (logout_result.content | b64decode | from_json).passed
        - name: Verify final primary proxy access in both address families
          ansible.builtin.command:
            argv: [/usr/bin/python3, '-', '{{ item.address }}']
            stdin: '{{ lookup("ansible.builtin.file", logout_bundle + "/startup-network-client.py") }}'
            chdir: /
          delegate_to: logout_proxy
          become: false
          loop:
            - {address: '10.1.2.170', source: '10.1.0.53'}
            - {address: 'fd36:5aa8:6971:1::170', source: 'fd36:5aa8:6971:1::53'}
          register: logout_proxy_probe
          changed_when: false
          failed_when: >-
            logout_proxy_probe.rc != 0 or
            (logout_proxy_probe.stdout | from_json).status != 200 or
            (logout_proxy_probe.stdout | from_json).source != item.source
      always:
        - name: Stop only the operation-owned test unit after any session attempt
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, stop, '{{ logout_operation.test_unit }}']
            chdir: /
          when: logout_session_attempted | default(false)
          register: logout_stop
          changed_when: true
          failed_when: false
        - name: Collect exact private node evidence without deleting it
          ansible.builtin.fetch:
            src: '{{ logout_operation.root }}/{{ item }}'
            dest: '{{ logout_evidence }}/'
            flat: true
          loop: [before.json, owned-session.json, closed.json, samples.jsonl, result.json]
          register: logout_fetch
          failed_when: false
        - name: Collect unit status even when observation failed
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, show, '{{ item }}', '--property=Id,ActiveState,SubState,Result,MainPID']
          loop: ['{{ logout_operation.test_unit }}', '{{ logout_operation.observer_unit }}']
          register: logout_final_units
          changed_when: false
          failed_when: false
        - name: Retain controller cleanup and collection results
          ansible.builtin.copy:
            content: '{{ {"stop": logout_stop, "units": logout_final_units.results, "collection": logout_fetch.results} | to_nice_json }}'
            dest: '{{ logout_evidence }}/orchestration.json'
            mode: '0600'
          delegate_to: localhost
          become: false
        - name: Reject unresolved owned-unit cleanup
          ansible.builtin.assert:
            that:
              - logout_stop.rc | default(0) == 0
              - item.rc == 0
              - "'MainPID=0' in item.stdout_lines"
              - "'ActiveState=inactive' in item.stdout_lines or 'ActiveState=failed' in item.stdout_lines"
          loop: '{{ logout_final_units.results }}'
