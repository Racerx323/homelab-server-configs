---
- name: Qualify temporary Nautobot backup captures
  hosts: inventory_automation
  gather_facts: false
  become: true
  pre_tasks:
    - name: Require reviewed qualification scope
      ansible.builtin.assert:
        that:
          - qualification_authorized | default(false) | bool
          - inventory_hostname == 'j2-svpi4mf'
          - ansible_play_hosts_all | length == 1
          - qualification_root is match('^/tmp/nautobot-capture-qualification\.[0-9a-f]{32}$')
    - name: Inspect destination
      ansible.builtin.stat:
        path: '{{ qualification_root }}'
      register: destination
    - name: Reject existing destination
      ansible.builtin.assert:
        that: not destination.stat.exists
  tasks:
    - name: Stage and qualify captures
      block:
        - name: Create private destination
          ansible.builtin.file:
            path: '{{ qualification_root }}'
            state: directory
            owner: root
            group: root
            mode: '0700'
        - name: Stage frozen nonsecret inputs
          ansible.builtin.copy:
            src: '{{ item.source }}'
            dest: '{{ qualification_root }}/{{ item.name }}'
            owner: root
            group: root
            mode: '0600'
          loop: '{{ qualification_files }}'
        - name: Read back staged files
          ansible.builtin.stat:
            path: '{{ qualification_root }}/{{ item.name }}'
            checksum_algorithm: sha256
          loop: '{{ qualification_files }}'
          register: staged
        - name: Verify staged identities
          ansible.builtin.assert:
            that:
              - item.stat.isreg
              - not item.stat.islnk
              - item.stat.checksum == item.item.sha256
          loop: '{{ staged.results }}'
        - name: Run bounded capture checks
          ansible.builtin.command:
            argv: [/usr/bin/python3, -B, '{{ qualification_root }}/qualify-workload-capture.py', --root, '{{ qualification_root }}']
            chdir: /
          async: 960
          poll: 5
          changed_when: true
      always:
        - name: Collect only sanitized qualification receipt
          ansible.builtin.fetch:
            src: '{{ qualification_root }}/capture-qualification.json'
            dest: '{{ qualification_evidence }}/'
            flat: true
          register: receipt
          failed_when: false
        - name: Preserve receipt availability
          ansible.builtin.copy:
            content: '{{ {"receipt_collected": receipt.dest is defined, "result": receipt.msg | default("collected")} | to_nice_json }}'
            dest: '{{ qualification_evidence }}/collection.json'
            mode: '0600'
          delegate_to: localhost
          become: false
        - name: Require receipt for review
          ansible.builtin.stat:
            path: '{{ qualification_evidence }}/capture-qualification.json'
          delegate_to: localhost
          become: false
          register: retained
        - name: Reject missing decision evidence
          ansible.builtin.assert:
            that: retained.stat.isreg | default(false)
