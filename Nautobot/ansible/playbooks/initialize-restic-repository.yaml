---
- name: Initialize only the accepted Nautobot Restic repository
  hosts: inventory_automation
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars_files:
    - ../../../inventory/prod/groups/inventory_automation.yaml
    - ../../../inventory/prod/hosts/j2-svpi4mf.yaml
  vars:
    restic_init_operation: '{{ lookup(''ansible.builtin.file'', ''../../manifests/operation.yaml'') |
      from_yaml }}'
  pre_tasks:
    - name: Reject direct or unready execution before target commands
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'j2-svpi4mf'
          - ansible_play_hosts_all | length == 1
          - restic_init_authorized | default(false) | bool
          - restic_init_operation.operation.stage == 'restic_repository_initialization'
          - restic_init_operation.operation.authorization_ready | bool
          - restic_init_operation.authorization.mutation_authorized | bool
          - restic_init_operation.authorization.blockers | length == 0
          - restic_init_evidence_root is match('^/tmp/nautobot-restic-initialization[.][A-Za-z0-9_]+$')
  tasks:
    - name: Create unique protected initialization directory
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - -n
          - /usr/sbin/runuser
          - --user
          - nautobot
          - --
          - /usr/bin/mktemp
          - --directory
          - /tmp/nautobot-restic-init.XXXXXXXX
      changed_when: true
      register: restic_init_directory
    - name: Validate unique directory boundary
      ansible.builtin.assert:
        that:
          - restic_init_directory.stdout is match('^/tmp/nautobot-restic-init[.][A-Za-z0-9_]+$')
    - name: Protected initialization with unconditional credential cleanup
      block:
        - name: Create protected repository
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/install
              - --mode=0600
              - /dev/null
              - '{{ restic_init_directory.stdout }}/repository'
          changed_when: true
          no_log: true
        - name: Write protected repository
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/tee
              - '{{ restic_init_directory.stdout }}/repository'
            stdin: '{{ restic_init_operation.repository.url }}'
            stdin_add_newline: false
          changed_when: true
          no_log: true
        - name: Create protected password
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/install
              - --mode=0600
              - /dev/null
              - '{{ restic_init_directory.stdout }}/password'
          changed_when: true
          no_log: true
        - name: Write protected password
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/tee
              - '{{ restic_init_directory.stdout }}/password'
            stdin: '{{ restic_repository_password }}'
            stdin_add_newline: false
          changed_when: true
          no_log: true
        - name: Create protected credentials.json
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/install
              - --mode=0600
              - /dev/null
              - '{{ restic_init_directory.stdout }}/credentials.json'
          changed_when: true
          no_log: true
        - name: Write protected credentials.json
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/tee
              - '{{ restic_init_directory.stdout }}/credentials.json'
            stdin: '{{ {''id'': restic_b2_application_key_id, ''key'': restic_b2_application_key} | to_json
              }}'
            stdin_add_newline: false
          changed_when: true
          no_log: true
        - name: Create protected initialize.py
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/install
              - --mode=0600
              - /dev/null
              - '{{ restic_init_directory.stdout }}/initialize.py'
          changed_when: true
          no_log: true
        - name: Write protected initialize.py
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/tee
              - '{{ restic_init_directory.stdout }}/initialize.py'
            stdin: '{{ lookup(''ansible.builtin.file'', ''../../../restic/scripts/initialize-repository.py'',
              rstrip=false) }}'
            stdin_add_newline: false
          changed_when: true
          no_log: true
        - name: Run single-use initialization boundary
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/python3
              - '{{ restic_init_directory.stdout }}/initialize.py'
              - '{{ restic_init_directory.stdout }}'
              - '{{ restic_init_operation.repository.url }}'
              - '{{ restic_init_operation.preflight.last_result.restic_version }}'
          changed_when: true
          register: restic_init_result
          failed_when: false
          no_log: true
      always:
        - name: Remove transient repository
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/rm
              - --force
              - --
              - '{{ restic_init_directory.stdout }}/repository'
          register: cleanup_repository
          failed_when: false
          changed_when: true
          no_log: true
        - name: Remove transient password
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/rm
              - --force
              - --
              - '{{ restic_init_directory.stdout }}/password'
          register: cleanup_password
          failed_when: false
          changed_when: true
          no_log: true
        - name: Remove transient credentials.json
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/rm
              - --force
              - --
              - '{{ restic_init_directory.stdout }}/credentials.json'
          register: cleanup_credentials
          failed_when: false
          changed_when: true
          no_log: true
        - name: Verify credential removal
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/python3
              - -c
              - import os,sys; sys.exit(any(os.path.lexists(sys.argv[1]+'/'+n) for n in ('repository','password','credentials.json')))
              - '{{ restic_init_directory.stdout }}'
          register: cleanup_verification
          failed_when: false
          changed_when: false
        - name: Read bounded sanitized node evidence
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/sbin/runuser
              - --user
              - nautobot
              - --
              - /usr/bin/python3
              - -c
              - import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); names=('started.json','absence.json','init-attempt.json','init-result.json','result.json');
                print(json.dumps({n:json.loads((p/n).read_text()) for n in names if (p/n).is_file() and
                (p/n).stat().st_size<65536}))
              - '{{ restic_init_directory.stdout }}'
          changed_when: false
          register: restic_init_evidence
        - name: Preserve controller copy of node records
          ansible.builtin.copy:
            content: '{{ restic_init_evidence.stdout }}'
            dest: '{{ restic_init_evidence_root }}/node-records.json'
            mode: '0600'
          delegate_to: localhost
        - name: Require all cleanup attempts and absence verification to succeed
          ansible.builtin.assert:
            that:
              - cleanup_repository.rc == 0
              - cleanup_password.rc == 0
              - cleanup_credentials.rc == 0
              - cleanup_verification.rc == 0
            fail_msg: Credential cleanup failed; retained node evidence requires manual intervention.
    - name: Require successful initialization and evidence
      ansible.builtin.assert:
        that:
          - restic_init_result.rc == 0
          - (restic_init_evidence.stdout | from_json)['result.json'].result == 'initialized_review_required'
