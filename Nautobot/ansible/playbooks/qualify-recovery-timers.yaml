---
- name: Qualify independent writer recovery and bounded timer dispatch
  hosts: inventory_automation
  gather_facts: false
  become: true
  vars:
    op: '{{ capture_operation }}'
    run_root: /var/lib/nautobot/protection/recovery-qualification
    user_environment:
      HOME: /var/lib/nautobot
      XDG_RUNTIME_DIR: /run/user/999
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/999/bus
      PYTHONDONTWRITEBYTECODE: '1'
  tasks:
    - name: Require the exact recovery-only stage
      ansible.builtin.assert:
        that:
          - capture_bundle_verified | bool
          - op.operation.execution_enabled | bool
          - op.operation.stage == 'recurring_failure_recovery_timer_qualification'
          - ansible_play_hosts_all == ['j2-svpi4mf']
          - ansible_host == '10.1.2.170'
          - not ansible_check_mode
    - name: Claim the absent evidence directory once
      ansible.builtin.command:
        argv: [/usr/bin/mkdir, --mode=0700, '{{ run_root }}']
        chdir: /
      changed_when: true
    - name: Set protected service ownership
      ansible.builtin.file:
        path: '{{ run_root }}'
        owner: '999'
        group: '985'
        mode: '0700'
    - name: Transfer frozen execution inputs
      ansible.builtin.copy:
        src: '{{ capture_bundle }}/runtime/'
        dest: '{{ run_root }}/'
        owner: '999'
        group: '985'
        mode: '0600'
        directory_mode: '0700'
    - name: Execute each fault once and require recovery before the next
      ansible.builtin.include_tasks: '{{ capture_bundle }}/recovery-case.yaml'
      loop: [killed, deadline]
      loop_control:
        loop_var: recovery_case
    - name: Qualify calendar parsing and one harmless timer callback
      become_user: nautobot
      environment: '{{ user_environment }}'
      ansible.builtin.command:
        argv: [/usr/bin/python3, -B, '{{ run_root }}/scripts/recovery_qualification.py', timer, '{{ run_root }}']
        chdir: /
      changed_when: true
