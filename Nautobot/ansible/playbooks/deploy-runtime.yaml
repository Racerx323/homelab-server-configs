---
- name: Initialize private Nautobot data services and migrations only
  hosts: inventory_automation
  gather_facts: false
  become: false
  any_errors_fatal: true
  module_defaults:
    ansible.builtin.command:
      chdir: /
  vars:
    runtime_operation: '{{ lookup(''ansible.builtin.file'', ''../../manifests/operation.yaml'') | from_yaml
      }}'
    runtime_home: /var/lib/nautobot
    runtime_units:
      - nautobot-private.network
      - nautobot-postgresql_data.volume
      - nautobot-redis_data.volume
      - nautobot-postgresql.container
      - nautobot-redis.container
      - nautobot-migration.container
    runtime_user_command:
      - /usr/bin/sudo
      - -n
      - /usr/sbin/runuser
      - --user
      - nautobot
      - --
      - /usr/bin/env
      - XDG_RUNTIME_DIR=/run/user/999
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/999/bus
  pre_tasks:
    - name: Block unreviewed execution before any host command
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'j2-svpi4mf'
          - ansible_play_hosts_all | length == 1
          - runtime_operation.operation.stage | default('') == 'runtime_initialization'
          - runtime_operation.operation.authorization_ready | bool
          - runtime_operation.authorization.mutation_authorized | bool
          - runtime_operation.authorization.blockers | length == 0
          - runtime_bundle_verified | default(false) | bool
          - runtime_operation.runtime.first_install_only | bool
        fail_msg: Runtime definition is inactive; reviewed operation and bundle required.
    - name: Verify all local rendered files against the reviewed bundle
      ansible.builtin.stat:
        path: '{{ runtime_rendered_directory }}/{{ item }}'
        checksum_algorithm: sha256
      delegate_to: localhost
      loop: '{{ runtime_units }}'
      register: runtime_local_files
    - name: Require exact regular-file identities
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.checksum == runtime_operation.runtime.artifact_sha256[item.item]
      loop: '{{ runtime_local_files.results }}'
    - name: Verify canonical account
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - nautobot
      changed_when: false
      register: runtime_account
    - name: Require reviewed account identity
      ansible.builtin.assert:
        that:
          - (runtime_account.stdout | split(':'))[2:4] == ['999', '985']
          - (runtime_account.stdout | split(':'))[5] == runtime_home
    - name: Inspect existing unit paths without replacing a deployment
      ansible.builtin.stat:
        path: '{{ runtime_home }}/.config/containers/systemd/{{ item }}'
      become: true
      loop:
        - nautobot-private.network
        - nautobot-postgresql_data.volume
        - nautobot-redis_data.volume
        - nautobot-postgresql.container
        - nautobot-redis.container
        - nautobot-migration.container
        - nautobot-web.container
        - nautobot-worker.container
        - nautobot-scheduler.container
        - nautobot-nautobot_media.volume
      register: runtime_existing
    - name: Require a first installation
      ansible.builtin.assert:
        that: not item.stat.exists
      loop: '{{ runtime_existing.results }}'
    - name: Inspect existing runtime objects before first installation
      ansible.builtin.command:
        argv: '{{ runtime_user_command + ["/usr/bin/podman"] + item }}'
      loop:
        - - ps
          - --all
          - --format
          - json
        - - volume
          - ls
          - --format
          - json
        - - network
          - ls
          - --format
          - json
      changed_when: false
      register: runtime_objects
    - name: Refuse existing Nautobot objects including partial installation residue
      ansible.builtin.assert:
        that: '''nautobot'' not in (item.stdout | lower)'
        fail_msg: Existing Nautobot runtime objects require a separate ownership and recovery review.
      loop: '{{ runtime_objects.results }}'
      no_log: true
    - name: Inspect protected service environment files
      ansible.builtin.stat:
        path: '{{ runtime_home }}/runtime/{{ item }}.env'
      become: true
      loop:
        - postgresql
        - redis
        - migration
      register: runtime_environments
      no_log: true
    - name: Require canonical ownership and protected environment files
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.uid == 999
          - item.stat.mode == '0600'
      loop: '{{ runtime_environments.results }}'
      no_log: true
    - name: Inspect non-secret application configuration
      ansible.builtin.stat:
        path: '{{ runtime_home }}/runtime/nautobot_config.py'
        checksum_algorithm: sha256
      become: true
      register: runtime_config
    - name: Require reviewed application configuration readable inside container
      ansible.builtin.assert:
        that:
          - runtime_config.stat.isreg
          - not runtime_config.stat.islnk
          - runtime_config.stat.uid == 999
          - runtime_config.stat.mode == '0644'
          - runtime_config.stat.checksum == runtime_operation.runtime.configuration_sha256
    - name: Verify provisioned Redis configuration secret metadata only
      ansible.builtin.command:
        argv: '{{ runtime_user_command + [''/usr/bin/podman'', ''secret'', ''inspect'', ''nautobot-redis-config'']
          }}'
      changed_when: false
      register: runtime_secret
    - name: Require Redis secret
      ansible.builtin.assert:
        that: (runtime_secret.stdout | from_json)[0].Spec.Name == 'nautobot-redis-config'
    - name: Create protected node evidence directory
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - -n
          - /usr/bin/mktemp
          - --directory
          - /tmp/nautobot-runtime.XXXXXXXX
      register: runtime_node
      changed_when: true
    - name: Validate node evidence path
      ansible.builtin.assert:
        that: runtime_node.stdout is match('^/tmp/nautobot-runtime[.][A-Za-z0-9_]+$')
    - name: Stage bounded initialization evidence helpers
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '{{ runtime_node.stdout }}/{{ item.name }}'
        mode: '0600'
      become: true
      loop:
        - src: '{{ playbook_dir }}/../scripts/runtime-initialization-node.py'
          name: runtime-initialization-node.py
        - src: '{{ playbook_dir }}/../../../restic/scripts/canary-backup.py'
          name: canary-backup.py
    - name: Stage reviewed non-secret operation
      ansible.builtin.copy:
        content: '{{ runtime_operation | to_json }}'
        dest: '{{ runtime_node.stdout }}/operation.json'
        mode: '0600'
      become: true
    - name: Verify current images configuration and headroom
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - -n
          - /usr/bin/python3
          - '{{ runtime_node.stdout }}/runtime-initialization-node.py'
          - preflight
          - '{{ runtime_node.stdout }}'
      changed_when: false
      register: runtime_preflight
      failed_when: false
    - name: Preserve preflight
      ansible.builtin.copy:
        content: '{{ {"status": runtime_preflight.rc, "output": runtime_preflight.stdout} | to_json }}'
        dest: '{{ runtime_evidence_root }}/preflight.json'
        mode: '0600'
      delegate_to: localhost
    - name: Require current preflight
      ansible.builtin.assert:
        that:
          - runtime_preflight.rc == 0
          - (runtime_preflight.stdout | from_json).passed | bool
    - name: Capture current boot and kernel cursor
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - -n
          - /usr/bin/python3
          - '{{ runtime_node.stdout }}/runtime-initialization-node.py'
          - journal-baseline
          - '{{ runtime_node.stdout }}'
      changed_when: false
      register: runtime_cursor
      failed_when: false
    - name: Require journal baseline
      ansible.builtin.assert:
        that: runtime_cursor.rc == 0
    - name: Preserve node journal baseline
      ansible.builtin.copy:
        content: '{{ runtime_cursor.stdout }}'
        dest: '{{ runtime_node.stdout }}/journal-baseline.json'
        mode: '0600'
      become: true
  tasks:
    - name: Apply once and preserve stage results on failure
      block:
        - name: Install bounded native migration entrypoint
          ansible.builtin.copy:
            src: '{{ playbook_dir }}/../scripts/initialize-application.py'
            dest: /var/lib/nautobot/runtime/initialize-application.py
            owner: nautobot
            group: nautobot
            mode: '0644'
            force: false
          become: true
        - name: Create owned user Quadlet directory
          ansible.builtin.file:
            path: '{{ runtime_home }}/.config/containers/systemd'
            state: directory
            owner: nautobot
            group: nautobot
            mode: '0700'
          become: true
        - name: Install exact reviewed Quadlets
          ansible.builtin.copy:
            src: '{{ runtime_rendered_directory }}/{{ item }}'
            dest: '{{ runtime_home }}/.config/containers/systemd/{{ item }}'
            owner: nautobot
            group: nautobot
            mode: '0600'
            force: false
          become: true
          loop: '{{ runtime_units }}'
        - name: Generate user units
          ansible.builtin.command:
            argv: '{{ runtime_user_command + [''/usr/bin/systemctl'', ''--user'', ''daemon-reload''] }}'
          changed_when: true
        - name: Start postgresql and stop sequence on failure
          ansible.builtin.command:
            argv: '{{ runtime_user_command + [''/usr/bin/systemctl'', ''--user'', ''start'', ''nautobot-postgresql.service'']
              }}'
          changed_when: true
          register: runtime_start_postgresql
          no_log: true
        - name: Start redis and stop sequence on failure
          ansible.builtin.command:
            argv: '{{ runtime_user_command + [''/usr/bin/systemctl'', ''--user'', ''start'', ''nautobot-redis.service'']
              }}'
          changed_when: true
          register: runtime_start_redis
          no_log: true
        - name: Start migration and stop sequence on failure
          ansible.builtin.command:
            argv: '{{ runtime_user_command + [''/usr/bin/systemctl'', ''--user'', ''start'', ''nautobot-migration.service'']
              }}'
          changed_when: true
          register: runtime_start_migration
          no_log: true
        - name: Verify native initialization and private services
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/bin/python3
              - '{{ runtime_node.stdout }}/runtime-initialization-node.py'
              - postflight
              - '{{ runtime_node.stdout }}'
          changed_when: false
          register: runtime_postflight
          failed_when: false
        - name: Preserve postflight
          ansible.builtin.copy:
            content: '{{ {"status": runtime_postflight.rc, "output": runtime_postflight.stdout} | to_json
              }}'
            dest: '{{ runtime_evidence_root }}/postflight.json'
            mode: '0600'
          delegate_to: localhost
        - name: Require initialization postconditions
          ansible.builtin.assert:
            that:
              - runtime_postflight.rc == 0
              - (runtime_postflight.stdout | from_json).passed | bool
        - name: Observe delayed current-boot storage evidence
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/bin/python3
              - '{{ runtime_node.stdout }}/runtime-initialization-node.py'
              - journal-review
              - '{{ runtime_node.stdout }}'
          changed_when: false
          register: runtime_storage
          failed_when: false
        - name: Preserve storage-review
          ansible.builtin.copy:
            content: '{{ {"status": runtime_storage.rc, "output": runtime_storage.stdout} | to_json }}'
            dest: '{{ runtime_evidence_root }}/storage-review.json'
            mode: '0600'
          delegate_to: localhost
        - name: Require quiet storage observation
          ansible.builtin.assert:
            that:
              - runtime_storage.rc == 0
              - (runtime_storage.stdout | from_json).passed | bool
      always:
        - name: Read native migration receipt even after failure
          ansible.builtin.command:
            argv:
              - /usr/bin/sudo
              - -n
              - /usr/bin/python3
              - '{{ runtime_node.stdout }}/runtime-initialization-node.py'
              - migration-evidence
              - '{{ runtime_node.stdout }}'
          register: runtime_native_receipt
          changed_when: false
          failed_when: false
        - name: Preserve sanitized native migration receipt
          ansible.builtin.copy:
            content: '{{ {"status": runtime_native_receipt.rc, "output": runtime_native_receipt.stdout}
              | to_json }}'
            dest: '{{ runtime_evidence_root }}/native-migration.json'
            mode: '0600'
          delegate_to: localhost
        - name: Preserve sanitized stage evidence
          ansible.builtin.copy:
            dest: '{{ runtime_evidence_root }}/runtime-stages.json'
            content: '{{ runtime_stage_record | to_json }}'
            mode: '0600'
          delegate_to: localhost
          vars:
            runtime_stage_record:
              journal_cursor: '{{ runtime_cursor.stdout }}'
              acceptance: false
              rollback_attempted: false
              postgresql_exit_status: '{{ runtime_start_postgresql.rc | default("not_observed") }}'
              redis_exit_status: '{{ runtime_start_redis.rc | default("not_observed") }}'
              migration_exit_status: '{{ runtime_start_migration.rc | default("not_observed") }}'
              node_evidence: '{{ runtime_node.stdout }}'
              initialization_postflight_status: '{{ runtime_postflight.rc | default("not_observed") }}'
              storage_review_status: '{{ runtime_storage.rc | default("not_observed") }}'
              stop_exit_statuses: '{{ runtime_stop.results | default([]) | map(attribute="rc") | list
                }}'
              application_started: false
              volumes_deleted: false
      rescue:
        - name: Stop only operation-owned services and preserve data on failure
          ansible.builtin.command:
            argv: '{{ runtime_user_command + [''/usr/bin/systemctl'', ''--user'', ''stop'', item] }}'
          loop:
            - nautobot-migration.service
            - nautobot-redis.service
            - nautobot-postgresql.service
          register: runtime_stop
          failed_when: false
          changed_when: true
          no_log: true
        - name: Require review of failed initialization without automatic retry
          ansible.builtin.fail:
            msg: Initialization failed; operation-owned services were asked to stop. Retain volumes and
              review sanitized records; do not retry or reverse migrations.
