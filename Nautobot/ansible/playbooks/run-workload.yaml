---
- name: Reviewed Nautobot workload qualification
  hosts: inventory_automation
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    workload_user: ['/usr/bin/sudo', '-n', '/usr/sbin/runuser', '--user', nautobot, '--', '/usr/bin/env', 'XDG_RUNTIME_DIR=/run/user/999', 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/999/bus']
  pre_tasks:
    - name: Reject unverified or unreviewed activation before target contact
      ansible.builtin.assert:
        that:
          - workload_bundle_verified | default(false) | bool
          - workload_baseline_verified | default(false) | bool
          - workload_execution.execution_authorized | default(false) | bool
          - workload_execution.backup.authorized | default(false) | bool
          - workload_execution.stage == 'workload_qualification'
          - inventory_hostname == 'j2-svpi4mf'
          - ansible_play_hosts_all | length == 1
          - workload_root is match('^/tmp/nautobot-workload\.[0-9a-f]{32}$')
    - name: Require a new protected operation directory
      ansible.builtin.stat:
        path: '{{ workload_root }}'
      become: true
      register: workload_destination
    - name: Reject retained or reused operation directory
      ansible.builtin.assert:
        that: not workload_destination.stat.exists
    - name: Create operation directory
      ansible.builtin.file:
        path: '{{ workload_root }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      become: true
    - name: Stage exact frozen files
      ansible.builtin.copy:
        src: '{{ item.source }}'
        dest: '{{ workload_root }}/{{ item.name }}'
        owner: root
        group: root
        mode: '0600'
      loop: '{{ workload_artifacts }}'
      become: true
    - name: Read back staged hashes
      ansible.builtin.stat:
        path: '{{ workload_root }}/{{ item.name }}'
        checksum_algorithm: sha256
      loop: '{{ workload_artifacts }}'
      become: true
      register: workload_staged
    - name: Require exact staged identities
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.checksum == item.item.sha256
      loop: '{{ workload_staged.results }}'
    - name: Read current boot and service identity before installing Jobs
      ansible.builtin.command:
        argv: ['/usr/bin/python3', '{{ workload_root }}/workload_session.py', --root, '{{ workload_root }}', --preflight]
        chdir: /
      become: true
      changed_when: false
  tasks:
    - name: Run qualification with unconditional evidence retention
      block:
        - name: Stage separately resolved transient backup credentials
          ansible.builtin.copy:
            src: '{{ workload_backup_secrets }}/{{ item }}'
            dest: '{{ workload_root }}/{{ item }}'
            owner: root
            group: root
            mode: '0600'
          loop: [repository, password, credentials.json]
          become: true
          no_log: true
        - name: Stage operation-owned Job modules without overwriting existing files
          ansible.builtin.command:
            argv: '{{ workload_user + ["/usr/bin/podman", "exec", "-i", item.0, "python3", "-c", workload_install_code, item.1.name] }}'
            stdin: '{{ lookup("ansible.builtin.file", item.1.source, rstrip=false) }}'
            stdin_add_newline: false
            chdir: /
          vars:
            workload_install_code: >-
              import os,sys;
              path='/opt/nautobot/jobs/'+sys.argv[1];
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600);
              stream=os.fdopen(fd,'wb');stream.write(sys.stdin.buffer.read());stream.close()
          loop: '{{ ["nautobot-web", "nautobot-worker"] | product(workload_job_artifacts) | list }}'
          changed_when: true
          register: workload_installed
        - name: Execute node-local deadline and stop boundary
          ansible.builtin.command:
            argv: ['/usr/bin/python3', '{{ workload_root }}/workload_session.py', --root, '{{ workload_root }}']
            chdir: /
          become: true
          async: 11000
          poll: 5
          changed_when: true
          register: workload_run
      always:
        - name: Attempt every remote credential cleanup independently
          ansible.builtin.file:
            path: '{{ workload_root }}/{{ item }}'
            state: absent
          loop: [password, credentials.json]
          become: true
          failed_when: false
          no_log: true
        - name: Verify transient credential absence
          ansible.builtin.stat:
            path: '{{ workload_root }}/{{ item }}'
          loop: [password, credentials.json]
          become: true
          register: workload_secret_residue
          failed_when: false
        - name: Remove only exact operation Job bytes from container tmpfs
          ansible.builtin.command:
            argv: '{{ workload_user + ["/usr/bin/podman", "exec", item.item.0, "python3", "-c", workload_remove_code, item.item.1.name, item.item.1.sha256] }}'
            chdir: /
          vars:
            workload_remove_code: >-
              import hashlib,pathlib,sys;
              p=pathlib.Path('/opt/nautobot/jobs')/sys.argv[1];
              exists=p.exists();
              assert not p.is_symlink();
              assert not exists or hashlib.sha256(p.read_bytes()).hexdigest()==sys.argv[2];
              p.unlink(missing_ok=True)
          loop: '{{ workload_installed.results | default([]) | selectattr("rc", "defined") | selectattr("rc", "eq", 0) | list }}'
          changed_when: true
          failed_when: false
          register: workload_cleanup
        - name: Collect the bounded evidence directory
          ansible.builtin.fetch:
            src: '{{ workload_root }}/{{ item }}'
            dest: '{{ workload_local_evidence }}/'
            flat: true
          loop: [result.json, samples.jsonl, phases.json, owned-jobs.json, job-results.json, ownership.json, backup-result.json, registration.json, stop-results.json, application-backup-result.json, application-capture-started.json, application-snapshots-before.json, application-snapshots-after.json]
          become: true
          failed_when: false
          register: workload_fetch
        - name: Preserve collection and cleanup results
          ansible.builtin.copy:
            content: '{{ {"cleanup": workload_cleanup.results, "collection": workload_fetch.results} | to_nice_json }}'
            dest: '{{ workload_local_evidence }}/orchestration.json'
            mode: '0600'
          delegate_to: localhost
        - name: Reject any remaining backup credential
          ansible.builtin.assert:
            that:
              - item.stat is defined
              - item.stat.exists is defined
              - not item.stat.exists
          loop: '{{ workload_secret_residue.results }}'
        - name: Report unresolved cleanup explicitly
          ansible.builtin.assert:
            that: workload_cleanup.results | selectattr('rc', 'ne', 0) | list | length == 0
            fail_msg: Preserve evidence and review operation-owned Job residue; do not delete fixture data or restore automatically.

        - name: Check mandatory evidence after a successful node run
          ansible.builtin.stat:
            path: '{{ workload_local_evidence }}/{{ item }}'
          loop: [result.json, samples.jsonl, phases.json, owned-jobs.json, job-results.json, ownership.json, backup-result.json, registration.json]
          delegate_to: localhost
          register: workload_required_evidence
          when: workload_run is defined and workload_run.rc | default(1) == 0
        - name: Reject successful execution with incomplete collection
          ansible.builtin.assert:
            that:
              - item.stat.isreg | default(false)
              - item.stat.size | default(0) > 0
          loop: '{{ workload_required_evidence.results | default([]) }}'
          when: workload_run is defined and workload_run.rc | default(1) == 0
