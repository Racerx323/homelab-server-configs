---
- name: Install only the approved recurring schedule
  hosts: inventory_automation
  gather_facts: false
  become: true
  vars:
    op: '{{ capture_operation }}'
    expected: '{{ lookup("ansible.builtin.file", capture_bundle + "/runtime-hashes.json") | from_json }}'
    user_environment:
      HOME: /var/lib/nautobot
      XDG_RUNTIME_DIR: /run/user/999
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/999/bus
      PYTHONDONTWRITEBYTECODE: '1'
    guard_command:
      - /usr/sbin/runuser
      - --user
      - nautobot
      - --
      - /usr/bin/python3
      - -B
      - '-'
  tasks:
    - name: Require exact installation stage
      ansible.builtin.assert:
        that:
          - capture_bundle_verified | bool
          - op.operation.execution_enabled | bool
          - op.operation.stage == 'recurring_schedule_enablement'
          - ansible_play_hosts_all == ['j2-svpi4mf']
          - ansible_host == '10.1.2.170'
          - not ansible_check_mode
    - name: Collect privileged zero-message journal cursor before mutation
      ansible.builtin.command:
        argv: [/usr/bin/journalctl, --show-cursor, -n, '0', --no-pager]
      changed_when: false
      register: journal_cursor
    - name: Verify fresh baseline or exact installed identity before mutation
      environment: '{{ user_environment }}'
      ansible.builtin.command:
        argv: '{{ guard_command + ["preflight", op | to_json, expected | to_json] }}'
        stdin: '{{ lookup("ansible.builtin.file", capture_bundle + "/schedule_install.py") }}'
        chdir: /
      changed_when: false
      register: preflight
    - name: Install absent runtime once, preserving all existing evidence
      when: (preflight.stdout | from_json).fresh
      block:
        - name: Claim the absent runtime directory
          ansible.builtin.command:
            argv: [/usr/bin/mkdir, --mode=0700, '{{ op.runtime_directory }}']
          register: claimed
          changed_when: true
        - name: Set protected runtime and state ownership
          ansible.builtin.file:
            path: '{{ item }}'
            state: directory
            owner: '999'
            group: '985'
            mode: '0700'
          loop:
            - '{{ op.runtime_directory }}'
            - '{{ op.state_directory }}'
            - '{{ op.state_directory }}/async'
            - '{{ op.state_directory }}/tmp'
            - '{{ op.unit_directory }}'
        - name: Transfer only frozen execution inputs
          ansible.builtin.copy:
            src: '{{ capture_bundle }}/runtime/'
            dest: '{{ op.runtime_directory }}/'
            owner: '999'
            group: '985'
            mode: '0600'
            directory_mode: '0700'
        - name: Verify the transferred bytes before linking executable units
          environment: '{{ user_environment }}'
          ansible.builtin.command:
            argv: '{{ guard_command + ["files", op | to_json, expected | to_json] }}'
            stdin: '{{ lookup("ansible.builtin.file", capture_bundle + "/schedule_install.py") }}'
          changed_when: false
        - name: Validate all nine units with the native service manager
          become_user: nautobot
          environment: '{{ user_environment }}'
          ansible.builtin.command:
            argv: '{{ ["/usr/bin/systemd-analyze", "--user", "verify"] + op.unit_paths }}'
          changed_when: false
        - name: Link only owned user units
          ansible.builtin.file:
            src: '{{ op.runtime_directory }}/units/{{ item }}'
            dest: '{{ op.unit_directory }}/{{ item }}'
            state: link
            owner: '999'
            group: '985'
            force: false
          loop: '{{ op.unit_names }}'
        - name: Load exact user unit definitions
          become_user: nautobot
          environment: '{{ user_environment }}'
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, --user, daemon-reload]
          changed_when: true
        - name: Enable only the three approved timers
          become_user: nautobot
          environment: '{{ user_environment }}'
          ansible.builtin.command:
            argv: '{{ ["/usr/bin/systemctl", "--user", "enable", "--now"] + op.enabled_timers }}'
          changed_when: true
        - name: Verify installation independently of Ansible changed flags
          environment: '{{ user_environment }}'
          ansible.builtin.command:
            argv: '{{ guard_command + ["verify", op | to_json, expected | to_json] }}'
            stdin: '{{ lookup("ansible.builtin.file", capture_bundle + "/schedule_install.py") }}'
            chdir: /
          changed_when: false
          register: installed
      rescue:
        - name: Refuse cleanup if this execution did not claim the runtime
          ansible.builtin.assert:
            that:
              - claimed is defined
              - claimed.rc | default(1) == 0
        - name: Prove owned rollback scope and absence of active writer recovery
          environment: '{{ user_environment }}'
          ansible.builtin.command:
            argv: '{{ guard_command + ["rollback-guard", op | to_json, expected | to_json] }}'
            stdin: '{{ lookup("ansible.builtin.file", capture_bundle + "/schedule_install.py") }}'
          changed_when: false
        - name: Disable only installed owned timers
          become_user: nautobot
          environment: '{{ user_environment }}'
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, --user, disable, --now, '{{ item }}']
          loop: '{{ op.enabled_timers }}'
          register: disabled
          failed_when: false
          changed_when: disabled.rc == 0
        - name: Require timers disabled before removing recovery links
          environment: '{{ user_environment }}'
          ansible.builtin.command:
            argv: '{{ guard_command + ["rollback-disabled", op | to_json, expected | to_json] }}'
            stdin: '{{ lookup("ansible.builtin.file", capture_bundle + "/schedule_install.py") }}'
          changed_when: false
        - name: Remove only owned links and retain runtime, state and payloads
          ansible.builtin.file:
            path: '{{ op.unit_directory }}/{{ item }}'
            state: absent
          loop: '{{ op.unit_names }}'
        - name: Reload user manager after rollback
          become_user: nautobot
          environment: '{{ user_environment }}'
          ansible.builtin.command:
            argv: [/usr/bin/systemctl, --user, daemon-reload]
          changed_when: true
        - name: Report failed installation with retained diagnostics
          ansible.builtin.fail:
            msg: Schedule installation failed; owned links removed, runtime/state retained. Do not replay the claim.
    - name: Record controller-side installation receipt, never scheduled acceptance
      become: false
      delegate_to: localhost
      ansible.builtin.copy:
        dest: '{{ capture_evidence }}/installation.json'
        mode: '0600'
        content: '{{ {"preflight": preflight.stdout | from_json, "installation": installed.stdout | default(preflight.stdout) | from_json, "journal_cursor": journal_cursor.stdout, "scheduled_cycle_accepted": false} | to_nice_json }}'
