---
- name: Provision only protected Nautobot credential inputs
  hosts: credential_target
  gather_facts: false
  become: true
  module_defaults:
    ansible.builtin.command:
      chdir: /
  vars:
    runtime_dir: /var/lib/nautobot/runtime
    user_command: [/usr/sbin/runuser, --user, nautobot, --, /usr/bin/env, 'HOME=/var/lib/nautobot', 'XDG_RUNTIME_DIR=/run/user/999', /usr/bin/podman]
    files: [postgresql.env, redis.env, migration.env, web.env, worker.env, scheduler.env]
  tasks:
    - name: Require exact verified one-host scope
      ansible.builtin.assert:
        that:
          - credential_bundle_verified | default(false) | bool
          - inventory_hostname == 'credential_target'
          - ansible_play_hosts_all | length == 1
          - credential_mode in ['preflight', 'inject']
    - name: Read target identity and health
      ansible.builtin.command:
        argv: '{{ item }}'
      loop:
        - [hostnamectl, --static]
        - [cat, /proc/sys/kernel/random/boot_id]
        - [getent, passwd, nautobot]
        - [systemctl, is-active, user@999.service]
        - [systemctl, --failed, --no-legend, --plain]
      register: identity
      changed_when: false
    - name: Require accepted host context
      ansible.builtin.assert:
        that:
          - identity.results[0].stdout == 'j2-svpi4mf'
          - identity.results[1].stdout == (lookup('file', bundle_root + '/accepted.yaml') | from_yaml).host_baseline.boot_id
          - "(identity.results[2].stdout | split(':'))[2:4] == ['999', '985']"
          - "(identity.results[2].stdout | split(':'))[5] == '/var/lib/nautobot'"
          - identity.results[3].stdout == 'active'
          - identity.results[4].stdout == ''
    - name: Inspect runtime account home
      ansible.builtin.stat:
        path: /var/lib/nautobot
      register: account_home
    - name: Require existing regular home directory
      ansible.builtin.assert:
        that:
          - account_home.stat.isdir
          - not account_home.stat.islnk
          - account_home.stat.uid == 999
    - name: Require fresh runtime directory
      ansible.builtin.stat:
        path: '{{ runtime_dir }}'
      register: existing
    - name: Refuse existing or partial credentials
      ansible.builtin.assert:
        that: not existing.stat.exists
    - name: Read existing rootless object metadata
      ansible.builtin.command:
        argv: '{{ user_command + item }}'
      loop:
        - [ps, -a, --format, json]
        - [secret, ls, --format, json]
      register: objects
      changed_when: false
      no_log: true
    - name: Refuse existing rootless containers or secrets
      ansible.builtin.assert:
        that:
          - (objects.results[0].stdout | from_json) == []
          - (objects.results[1].stdout | default('[]', true) | from_json) == []
      no_log: true
    - name: Inject protected files and verify contents privately
      when: credential_mode == 'inject'
      no_log: true
      diff: false
      block:
        - name: Create exclusive runtime directory
          ansible.builtin.command:
            argv: [mkdir, --mode=0700, '{{ runtime_dir }}']
          changed_when: true
        - name: Set runtime directory ownership
          ansible.builtin.file:
            path: '{{ runtime_dir }}'
            owner: nautobot
            group: nautobot
            mode: '0700'
        - name: Copy six scoped environment files
          ansible.builtin.copy:
            src: '{{ payload_root }}/{{ item }}'
            dest: '{{ runtime_dir }}/{{ item }}'
            owner: nautobot
            group: nautobot
            mode: '0600'
          loop: '{{ files }}'
        - name: Copy non-secret version-reviewed application settings
          ansible.builtin.copy:
            src: '{{ bundle_root }}/settings.py'
            dest: '{{ runtime_dir }}/nautobot_config.py'
            owner: nautobot
            group: nautobot
            mode: '0644'
        - name: Create Redis secret through standard input
          ansible.builtin.command:
            argv: '{{ user_command + ["secret", "create", "nautobot-redis-config", "-"] }}'
            stdin: '{{ lookup("file", payload_root + "/redis.conf", rstrip=False) }}'
            stdin_add_newline: false
          changed_when: true
        - name: Read injected environments for private comparison
          ansible.builtin.slurp:
            src: '{{ runtime_dir }}/{{ item }}'
          loop: '{{ files }}'
          register: injected
        - name: Verify exact environments without persisting hashes
          ansible.builtin.assert:
            that: (item.content | b64decode) == lookup('file', payload_root + '/' + item.item, rstrip=False)
          loop: '{{ injected.results }}'
        - name: Verify environment ownership and mode
          ansible.builtin.stat:
            path: '{{ runtime_dir }}/{{ item }}'
            get_checksum: false
          loop: '{{ files }}'
          register: modes
        - name: Require protected regular files
          ansible.builtin.assert:
            that:
              - item.stat.isreg
              - not item.stat.islnk
              - item.stat.uid == 999
              - item.stat.gid == 985
              - item.stat.mode == '0600'
          loop: '{{ modes.results }}'
        - name: Privately read Redis secret for comparison
          ansible.builtin.command:
            argv: '{{ user_command + ["secret", "inspect", "--showsecret", "nautobot-redis-config"] }}'
          changed_when: false
          register: redis_secret
        - name: Verify Redis stored value
          ansible.builtin.assert:
            that: (redis_secret.stdout | from_json)[0].SecretData == lookup('file', payload_root + '/redis.conf', rstrip=False)

        - name: Read non-secret settings for verification
          ansible.builtin.slurp:
            src: '{{ runtime_dir }}/nautobot_config.py'
          register: settings_readback
        - name: Verify exact settings content
          ansible.builtin.assert:
            that: (settings_readback.content | b64decode) == lookup('file', bundle_root + '/settings.py', rstrip=False)
        - name: Check settings ownership and mode
          ansible.builtin.stat:
            path: '{{ runtime_dir }}/nautobot_config.py'
            get_checksum: false
          register: settings_mode
        - name: Require non-secret settings readable inside rootless container
          ansible.builtin.assert:
            that:
              - settings_mode.stat.isreg
              - not settings_mode.stat.islnk
              - settings_mode.stat.uid == 999
              - settings_mode.stat.gid == 985
              - settings_mode.stat.mode == '0644'
        - name: Verify no containers started
          ansible.builtin.command:
            argv: '{{ user_command + ["ps", "-a", "--format", "json"] }}'
          register: final_containers
          changed_when: false
        - name: Require unchanged no-container boundary
          ansible.builtin.assert:
            that: (final_containers.stdout | from_json) == []
