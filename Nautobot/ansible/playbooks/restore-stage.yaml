---
- name: Require explicit frozen staging inventory
  ansible.builtin.assert:
    that:
      - restore_files | length > 0
      - restore_scripts == restore_root + '/scripts'
      - restore_stage_uid | int == (999 if restore_context == 'target' else lookup('pipe', 'id -u') | int)
- name: Create exclusive staging roots without following links
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os, pathlib, sys
        root, monitor = map(pathlib.Path, sys.argv[1:3])
        uid = int(sys.argv[3])
        for path in (root, monitor):
            assert not any(p.is_symlink() for p in (path, *path.parents))
            assert not path.exists()
        if not root.parent.exists():
            root.parent.mkdir(mode=0o700)
            os.chown(root.parent, uid, -1)
        assert root.parent.stat().st_uid == uid
        assert root.parent.stat().st_mode & 0o777 == 0o700
        root.mkdir(mode=0o700)
        for path in (root, root/'scripts', root/'retrieval'):
            if path != root: path.mkdir(mode=0o700)
            os.chown(path, uid, -1)
        monitor.mkdir(mode=0o700)
      - '{{ restore_root }}'
      - '{{ restore_monitor_scripts }}'
      - '{{ restore_stage_uid | string }}'
  changed_when: true
- name: Copy only frozen nonsecret execution inputs
  ansible.builtin.copy:
    src: '{{ item.source }}'
    dest: '{{ item.destination }}'
    owner: '{{ item.uid | string }}'
    mode: '0600'
  loop: '{{ restore_files }}'
  loop_control:
    label: '{{ item.destination }}'
- name: Inspect copied input contents and ownership
  ansible.builtin.stat:
    path: '{{ item.destination }}'
    checksum_algorithm: sha256
  loop: '{{ restore_files }}'
  loop_control:
    label: '{{ item.destination }}'
  register: restore_staged_files
- name: Require exact staging readback
  ansible.builtin.assert:
    that:
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.uid == item.item.uid | int
      - item.stat.mode == '0600'
      - item.stat.checksum == item.item.sha256
  loop: '{{ restore_staged_files.results }}'
  loop_control:
    label: '{{ item.item.destination }}'
- name: Recheck production before guard and credential delivery
  ansible.builtin.command:
    argv: [/usr/bin/python3, -B, '{{ restore_monitor_scripts }}/restore_preflight.py', '{{ restore_monitor_scripts }}/operation.json']
  when: restore_context == 'target'
  changed_when: false
