---
- name: Install boot readiness without restarting application services
  hosts: j2-svpi4mf
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    boot_user: [/usr/sbin/runuser, --user, nautobot, '--', /usr/bin/env, 'XDG_RUNTIME_DIR=/run/user/999', 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/999/bus']
  pre_tasks:
    - name: Require exact verified stage
      ansible.builtin.assert:
        that:
          - boot_verified | default(false)
          - boot_operation.operation.stage == 'boot_readiness'
          - ansible_play_hosts_all == ['j2-svpi4mf']
    - name: Inspect unused persistent recovery directory
      ansible.builtin.stat:
        path: '{{ boot_operation.root }}'
      register: boot_root
    - name: Reject retained directory reuse
      ansible.builtin.assert:
        that: not boot_root.stat.exists
    - name: Create protected recovery directory
      ansible.builtin.file:
        path: '{{ boot_operation.root }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Stage exact read-only helpers
      ansible.builtin.copy:
        src: '{{ boot_bundle }}/{{ item }}'
        dest: '{{ boot_operation.root }}/{{ item }}'
        owner: root
        group: root
        mode: '0600'
      loop: [boot-readiness-node.py, logout-node.py, operation.json]
    - name: Verify stage identities
      ansible.builtin.stat:
        path: '{{ boot_operation.root }}/{{ item }}'
        checksum_algorithm: sha256
      loop: [boot-readiness-node.py, logout-node.py, operation.json]
      register: boot_staged
    - name: Require exact staged hashes
      ansible.builtin.assert:
        that: item.stat.checksum == boot_hashes[item.item]
      loop: '{{ boot_staged.results }}'
    - name: Verify live baseline before modifying runtime files
      ansible.builtin.command:
        argv: [/usr/bin/python3, '{{ boot_operation.root }}/boot-readiness-node.py', before, '{{ boot_operation.root }}']
      changed_when: false
    - name: Inspect original artifact metadata
      ansible.builtin.stat:
        path: '{{ item.destination }}'
        checksum_algorithm: sha256
      loop: '{{ boot_operation.artifacts }}'
      register: boot_originals
    - name: Require safe original artifacts
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - not item.stat.islnk
          - item.stat.checksum == item.item.before_sha256
      loop: '{{ boot_originals.results }}'
    - name: Preserve original bytes before mutation
      ansible.builtin.copy:
        src: '{{ item.destination }}'
        dest: '{{ boot_operation.root }}/original-{{ item.name }}'
        remote_src: true
        owner: root
        group: root
        mode: '0600'
      loop: '{{ boot_operation.artifacts }}'
    - name: Verify recovery copies
      ansible.builtin.stat:
        path: '{{ boot_operation.root }}/original-{{ item.name }}'
        checksum_algorithm: sha256
      loop: '{{ boot_operation.artifacts }}'
      register: boot_backups
    - name: Require intact recovery copies
      ansible.builtin.assert:
        that: item.stat.checksum == item.item.before_sha256
      loop: '{{ boot_backups.results }}'
  tasks:
    - name: Install exact changes and retain rollback evidence
      block:
        - name: Install reviewed two-artifact change
          ansible.builtin.copy:
            src: '{{ boot_bundle }}/{{ item.item.name }}'
            dest: '{{ item.item.destination }}'
            owner: '{{ item.stat.uid }}'
            group: '{{ item.stat.gid }}'
            mode: '{{ item.stat.mode }}'
          loop: '{{ boot_originals.results }}'
        - name: Reload user manager without starting or restarting units
          ansible.builtin.command:
            argv: '{{ boot_user + ["/usr/bin/systemctl", "--user", "daemon-reload"] }}'
          changed_when: true
        - name: Verify installed identity generated timeout and delayed continuity
          ansible.builtin.command:
            argv: [/usr/bin/python3, '{{ boot_operation.root }}/boot-readiness-node.py', after, '{{ boot_operation.root }}']
          changed_when: false
      rescue:
        - name: Restore both original artifacts even after partial copy failure
          ansible.builtin.copy:
            src: '{{ boot_operation.root }}/original-{{ item.item.name }}'
            dest: '{{ item.item.destination }}'
            remote_src: true
            owner: '{{ item.stat.uid }}'
            group: '{{ item.stat.gid }}'
            mode: '{{ item.stat.mode }}'
          loop: '{{ boot_originals.results }}'
          register: boot_restore
          ignore_errors: true
        - name: Reload restored definitions
          ansible.builtin.command:
            argv: '{{ boot_user + ["/usr/bin/systemctl", "--user", "daemon-reload"] }}'
          register: boot_restore_reload
          changed_when: true
          failed_when: false
        - name: Independently verify rollback without restarting services
          ansible.builtin.command:
            argv: [/usr/bin/python3, '{{ boot_operation.root }}/boot-readiness-node.py', rollback, '{{ boot_operation.root }}']
          register: boot_rollback
          changed_when: false
          failed_when: false
        - name: Retain recovery result on controller
          ansible.builtin.copy:
            content: '{{ {"restore": boot_restore, "reload": boot_restore_reload, "verification": boot_rollback} | to_nice_json }}'
            dest: '{{ boot_evidence }}/rollback.json'
            mode: '0600'
          delegate_to: localhost
          become: false
        - name: Stop after failure without retry or automatic reboot
          ansible.builtin.fail:
            msg: Deployment failed; inspect retained rollback evidence before further action.
      always:
        - name: Fetch retained verification receipts without deleting remote recovery
          ansible.builtin.fetch:
            src: '{{ boot_operation.root }}/{{ item }}'
            dest: '{{ boot_evidence }}/'
            flat: true
          loop: [before.json, after.json, rollback.json]
          register: boot_fetch
          failed_when: false
        - name: Preserve evidence collection statuses
          ansible.builtin.copy:
            content: '{{ boot_fetch.results | to_nice_json }}'
            dest: '{{ boot_evidence }}/collection.json'
            mode: '0600'
          delegate_to: localhost
          become: false
