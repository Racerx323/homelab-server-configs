---
name: Repository validation

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline validation
    uses: >-
      Racerx323/homelab-docs/.github/workflows/reusable-validation.yml@7d09aae0bdf0fe80bc10263d1e8e5c682037d848
  caddy-current-production:
    name: Caddy current-production contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: homelab-server-configs
      - name: Check out the accepted DNS dependency
        uses: actions/checkout@v7
        with:
          repository: Racerx323/homelab-dns
          ref: 9ae13d0b03a4cec4124d411dd86b273462370129
          path: homelab-dns
      - name: Install focused-validation dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck shfmt
      - name: Repository policies
        run: Caddy/tests/run-focused.sh --profile current-repository-policies --phase host --container never
        working-directory: homelab-server-configs
      - name: Serving-health contracts
        run: Caddy/tests/run-focused.sh --profile current-serving-health --phase host --container never
        working-directory: homelab-server-configs
      - name: Synchronization contracts
        run: Caddy/tests/run-focused.sh --profile current-synchronization --phase host --container never
        working-directory: homelab-server-configs
  nautobot-contracts:
    name: Nautobot and Restic candidate contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.6'
          cache: false
      - name: Install offline validation dependencies
        run: python -m pip install ansible-core==2.19.2 check-jsonschema==0.33.3 jsonschema==4.25.1 PyYAML==6.0.2 Jinja2==3.1.6 pre-commit==4.3.0
      - name: Prepare the pinned Quadlet parser without running containers
        run: python Nautobot/tests/quadlet_tool.py --prepare
      - name: Validate schemas, launchers, runtime and failure handling
        run: python Nautobot/tests/run-validation.py
