---
minimum_pre_commit_version: "3.6.2"
default_stages: [pre-commit]
exclude: (?:^|/)(?:\.vexp|\.agents)/

repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: tests/repository/shfmt-canonical.sh --check
        language: system
        types: [shell]

      - id: multifile-grep-count-policy
        name: Reject multi-file grep scalar counts
        entry: tests/repository/multifile-grep-count-policy.sh --check
        language: system
        types: [shell]

      - id: accepted-live-hash-policy
        name: Reject stale Caddy accepted-live hash consumers
        entry: Caddy/tests/accepted-live-hash-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: deployable-successor-policy
        name: Validate Caddy neutral full-path deployment operation
        entry: /bin/bash Caddy/tests/deployable-successor-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: deployment-window-policy
        name: Enforce Caddy deployment window
        entry: /bin/bash Caddy/tests/deployment-window-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: systemd-boot-persistence-policy
        name: Validate Caddy systemd boot persistence contract
        entry: Caddy/tests/systemd-boot-persistence-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: focused-validation-manifest-policy
        name: Validate focused Caddy test manifest
        entry: Caddy/tests/focused-validation-manifest-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: test-lifecycle-policy
        name: Validate Caddy test lifecycle inventory
        entry: /bin/bash Caddy/tests/test-lifecycle-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: template-lifecycle-policy
        name: Reject nonproduction Caddy template consumers
        entry: /bin/bash Caddy/tests/template-lifecycle-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: operator-documentation-policy
        name: Validate Caddy operator documentation contract
        entry: /bin/bash Caddy/tests/operator-documentation-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: deployment-lifecycle-policy
        name: Reject nonproduction Caddy deployment inputs
        entry: /bin/bash Caddy/tests/deployment-lifecycle-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: caddy-environment-v2-policy
        name: Validate minimal Caddy node environment
        entry: /bin/bash Caddy/tests/caddy-environment-v2-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: portable-awk-policy
        name: Reject non-portable awk interval expressions
        entry: tests/repository/portable-awk-policy.sh --check
        language: system
        types: [shell]

      - id: remote-streamed-bash-policy
        name: Enforce safe remote Bash transport
        entry: tests/repository/remote-streamed-bash-policy.sh --check
        language: system
        types: [shell]
        files: ^(?:.*/)?scripts/.*\.sh$

      - id: repository-shell-policy-self-tests
        name: Validate repository shell policy regressions
        entry: /bin/bash tests/repository/run-policy-self-tests.sh
        language: system
        pass_filenames: false
        files: ^tests/repository/.*\.sh$

      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        types: [markdown]
        exclude: >-
          (?:^|/)AGENTS\.md$|^(?:LICENSE\.md|\.github/copilot-instructions\.md)$

      - id: yamllint
        name: yamllint
        entry: yamllint --strict
        language: system
        types: [yaml]

      - id: actionlint
        name: Validate GitHub Actions workflows
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

      - id: check-github-issue-forms
        name: Validate GitHub issue forms
        entry: >-
          check-jsonschema --builtin-schema vendor.github-issue-forms
        language: system
        types: [yaml]
        files: >-
          ^\.github/ISSUE_TEMPLATE/(?!config\.ya?ml$)[^/]+\.ya?ml$

      - id: check-github-issue-config
        name: Validate GitHub issue configuration
        entry: >-
          check-jsonschema --builtin-schema vendor.github-issue-config
        language: system
        types: [yaml]
        files: ^\.github/ISSUE_TEMPLATE/config\.ya?ml$

      - id: check-compose
        name: Validate Compose configuration
        entry: check-jsonschema --builtin-schema vendor.compose-spec
        language: system
        types: [yaml]
        files: >-
          (?:^|/)(?:compose|docker-compose|podman-compose)\.ya?ml$

      - id: nautobot-desired-state-schema
        name: Validate Nautobot desired state schema
        entry: >-
          check-jsonschema
          --schemafile Nautobot/schemas/desired-state.schema.json
          Nautobot/manifests/desired-state.yaml
        language: system
        pass_filenames: false
        files: >-
          ^Nautobot/(?:manifests/desired-state\.yaml|schemas/desired-state\.schema\.json)$

      - id: backblaze-b2-desired-state-schema
        name: Validate Backblaze B2 desired state
        entry: >-
          check-jsonschema
          --schemafile backblaze-b2/schemas/desired-state.schema.json
          backblaze-b2/manifests/desired-state.yaml
        language: system
        pass_filenames: false
        files: >-
          ^backblaze-b2/(?:manifests/desired-state\.yaml|schemas/desired-state\.schema\.json)$

      - id: backblaze-b2-operation-schema
        name: Validate Backblaze B2 operation state
        entry: >-
          check-jsonschema
          --schemafile backblaze-b2/schemas/operation.schema.json
          backblaze-b2/manifests/operation.yaml
        language: system
        pass_filenames: false
        files: >-
          ^backblaze-b2/(?:docs/MASTER_KEY_ROTATION(?:_PREFLIGHT)?\.md|manifests/operation\.yaml|schemas/operation\.schema\.json)$

      - id: backblaze-b2-capability-remediation-preflight
        name: Validate Backblaze B2 capability-remediation preflight
        entry: >-
          /bin/bash
          backblaze-b2/scripts/run-capability-remediation-preflight.sh
          self-test
        language: system
        pass_filenames: false
        files: >-
          ^(?:\.pre-commit-config\.yaml|backblaze-b2/(?:docs/(?:CAPABILITY_REMEDIATION_(?:DECISION|PREFLIGHT)|MANAGEMENT_CREDENTIAL_DECISION)\.md|manifests/operation\.yaml|schemas/operation\.schema\.json|scripts/(?:capability_remediation_preflight\.py|run-capability-remediation-preflight\.sh)|tests/capability-remediation-preflight-regression\.py))$

      - id: backblaze-b2-protected-doppler-master-write
        name: Validate Backblaze B2 protected Doppler master write
        entry: python3 backblaze-b2/tests/protected-doppler-master-write-regression.py
        language: system
        pass_filenames: false
        files: >-
          ^(?:\.pre-commit-config\.yaml|backblaze-b2/(?:docs/MASTER_KEY_ROTATION\.md|manifests/operation\.yaml|schemas/operation\.schema\.json|scripts/protected_doppler_master_write\.py|tests/protected-doppler-master-write-regression\.py))$

      - id: backblaze-b2-master-key-rotation-launcher
        name: Validate Backblaze B2 master-key rotation launcher
        entry: /bin/bash backblaze-b2/scripts/run-master-key-rotation.sh self-test
        language: system
        pass_filenames: false
        files: >-
          ^(?:\.pre-commit-config\.yaml|backblaze-b2/(?:docs/MASTER_KEY_ROTATION\.md|manifests/operation\.yaml|schemas/operation\.schema\.json|scripts/(?:protected_doppler_master_write\.py|run-master-key-rotation\.sh)|tests/(?:master-key-rotation-launcher-regression|protected-doppler-master-write-regression)\.py))$

      - id: nautobot-qualification-evidence-capture
        name: Validate Nautobot qualification evidence capture
        entry: >-
          /bin/bash tests/repository/run-with-ansible-local-temp.sh
          /bin/bash Nautobot/ansible/scripts/run-qualification.sh self-test
        language: system
        pass_filenames: false
        files: >-
          ^Nautobot/ansible/(?:README\.md|playbooks/qualify-host\.yaml|scripts/run-qualification\.sh)$

      - id: nautobot-assertion-expression-policy
        name: Validate Nautobot Ansible assertion expressions
        entry: >-
          python3 Nautobot/ansible/scripts/validate-assertion-expressions.py
        language: system
        pass_filenames: false
        files: >-
          ^Nautobot/ansible/(?:(?:playbooks|tasks)/.*\.ya?ml|scripts/validate-assertion-expressions\.py)$

      - id: nautobot-operation-schema
        name: Validate Nautobot operation state
        entry: >-
          check-jsonschema
          --schemafile Nautobot/schemas/operation.schema.json
          Nautobot/manifests/operation.yaml
        language: system
        pass_filenames: false
        files: >-
          ^Nautobot/(?:manifests/operation\.yaml|schemas/operation\.schema\.json)$

      - id: nautobot-host-baseline-launcher
        name: Validate Nautobot host-baseline operation
        entry: >-
          /bin/bash tests/repository/run-with-ansible-local-temp.sh
          /bin/bash Nautobot/ansible/scripts/run-host-baseline.sh self-test
        language: system
        pass_filenames: false
        files: >-
          ^Nautobot/ansible/(?:playbooks/host-baseline\.yaml|tasks/rollback-host-baseline\.yaml|scripts/run-host-baseline\.sh)$

      - id: nautobot-storage-diagnostic-launcher
        name: Validate Nautobot read-only storage diagnostic
        entry: >-
          /bin/bash tests/repository/run-with-ansible-local-temp.sh
          /bin/bash Nautobot/ansible/scripts/run-storage-diagnostic.sh self-test
        language: system
        pass_filenames: false
        files: >-
          (?x)^(?:
          \.pre-commit-config\.yaml
          |Nautobot/ansible/(?:README\.md|playbooks/diagnose-storage\.yaml|scripts/run-storage-diagnostic\.sh)
          |Nautobot/manifests/operation\.yaml
          |Nautobot/schemas/operation\.schema\.json
          |inventory/prod/(?:groups/inventory_automation\.yaml|hosts/j2-svpi4mf\.yaml)
          )$

      - id: nautobot-host-baseline-rollback-launcher
        name: Validate Nautobot standalone host-baseline rollback
        entry: >-
          /bin/bash tests/repository/run-with-ansible-local-temp.sh
          /bin/bash Nautobot/ansible/scripts/run-host-baseline-rollback.sh self-test
        language: system
        pass_filenames: false
        files: >-
          ^(?:Nautobot/(?:docs/(?:NAUTOBOT_DEPLOYMENT_PLAN|STORAGE_REMEDIATION_DECISION)\.md|manifests/operation\.yaml|schemas/operation\.schema\.json|ansible/(?:README\.md|playbooks/rollback-host-baseline\.yaml|scripts/run-host-baseline-rollback\.sh))|inventory/prod/(?:hosts\.yaml|groups/inventory_automation\.yaml|hosts/j2-svpi4mf\.yaml))$

      - id: nautobot-uas-quirk-launcher
        name: Validate Nautobot JMicron UAS-quirk operation
        entry: >-
          /bin/bash tests/repository/run-with-ansible-local-temp.sh
          /bin/bash Nautobot/ansible/scripts/run-uas-quirk.sh self-test
        language: system
        pass_filenames: false
        files: >-
          ^(?:Nautobot/(?:docs/STORAGE_REMEDIATION_DECISION\.md|manifests/operation\.yaml|schemas/operation\.schema\.json|ansible/(?:README\.md|playbooks/apply-uas-quirk\.yaml|scripts/run-uas-quirk\.sh))|inventory/prod/(?:hosts\.yaml|groups/inventory_automation\.yaml|hosts/j2-svpi4mf\.yaml))$

      - id: check-json
        name: Validate JSON with jq
        entry: jq empty
        language: system
        types: [json]

      - id: gitleaks
        name: Gitleaks
        entry: gitleaks protect --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
