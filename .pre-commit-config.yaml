---
minimum_pre_commit_version: "3.6.2"
default_stages: [pre-commit]
exclude: (?:^|/)(?:\.vexp|\.agents)/

repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: tests/repository/shfmt-canonical.sh --check
        language: system
        types: [shell]

      - id: multifile-grep-count-policy
        name: Reject multi-file grep scalar counts
        entry: tests/repository/multifile-grep-count-policy.sh --check
        language: system
        types: [shell]

      - id: accepted-live-hash-policy
        name: Reject stale Caddy accepted-live hash consumers
        entry: Caddy/tests/accepted-live-hash-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: deployable-successor-policy
        name: Validate Caddy neutral full-path deployment operation
        entry: /bin/bash Caddy/tests/deployable-successor-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: deployment-window-policy
        name: Enforce Caddy deployment window
        entry: /bin/bash Caddy/tests/deployment-window-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: systemd-boot-persistence-policy
        name: Validate Caddy systemd boot persistence contract
        entry: Caddy/tests/systemd-boot-persistence-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: focused-validation-manifest-policy
        name: Validate focused Caddy test manifest
        entry: Caddy/tests/focused-validation-manifest-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: test-lifecycle-policy
        name: Validate Caddy test lifecycle inventory
        entry: /bin/bash Caddy/tests/test-lifecycle-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: template-lifecycle-policy
        name: Reject nonproduction Caddy template consumers
        entry: /bin/bash Caddy/tests/template-lifecycle-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: operator-documentation-policy
        name: Validate Caddy operator documentation contract
        entry: /bin/bash Caddy/tests/operator-documentation-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: deployment-lifecycle-policy
        name: Reject nonproduction Caddy deployment inputs
        entry: /bin/bash Caddy/tests/deployment-lifecycle-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: caddy-environment-v2-policy
        name: Validate minimal Caddy node environment
        entry: /bin/bash Caddy/tests/caddy-environment-v2-policy.sh --check
        language: system
        pass_filenames: false
        files: ^(?:Caddy/|\.pre-commit-config\.yaml$)

      - id: portable-awk-policy
        name: Reject non-portable awk interval expressions
        entry: tests/repository/portable-awk-policy.sh --check
        language: system
        types: [shell]

      - id: remote-streamed-bash-policy
        name: Enforce safe remote Bash transport
        entry: tests/repository/remote-streamed-bash-policy.sh --check
        language: system
        types: [shell]
        files: ^(?:.*/)?scripts/.*\.sh$

      - id: repository-shell-policy-self-tests
        name: Validate repository shell policy regressions
        entry: /bin/bash tests/repository/run-policy-self-tests.sh
        language: system
        pass_filenames: false
        files: ^tests/repository/.*\.sh$

      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        types: [markdown]
        exclude: >-
          (?:^|/)AGENTS\.md$|^(?:LICENSE\.md|\.github/copilot-instructions\.md)$

      - id: yamllint
        name: yamllint
        entry: yamllint --strict
        language: system
        types: [yaml]

      - id: actionlint
        name: Validate GitHub Actions workflows
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

      - id: check-github-issue-forms
        name: Validate GitHub issue forms
        entry: >-
          check-jsonschema --builtin-schema vendor.github-issue-forms
        language: system
        types: [yaml]
        files: >-
          ^\.github/ISSUE_TEMPLATE/(?!config\.ya?ml$)[^/]+\.ya?ml$

      - id: check-github-issue-config
        name: Validate GitHub issue configuration
        entry: >-
          check-jsonschema --builtin-schema vendor.github-issue-config
        language: system
        types: [yaml]
        files: ^\.github/ISSUE_TEMPLATE/config\.ya?ml$

      - id: check-compose
        name: Validate Compose configuration
        entry: check-jsonschema --builtin-schema vendor.compose-spec
        language: system
        types: [yaml]
        files: >-
          (?:^|/)(?:compose|docker-compose|podman-compose)\.ya?ml$

      - id: check-json
        name: Validate JSON with jq
        entry: jq empty
        language: system
        types: [json]

      - id: gitleaks
        name: Gitleaks
        entry: gitleaks protect --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true
