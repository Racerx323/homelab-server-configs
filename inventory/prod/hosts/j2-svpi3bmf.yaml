---
display_name: Uptime Kuma availability monitoring host

functions:
  - monitoring

components:
  - uptime_kuma
  - needrestart
  - msmtp
  - watchdog

hardware:
  platform: raspberry_pi_3b_plus
  architecture: arm64
  memory_mib: 1024
  power:
    source: poe

storage:
  root:
    medium: microsd
    raw_capacity_gb: 32
    filesystem: ext4

foundation:
  deployment_status: accepted_20261111
  configuration_authority: homelab-server-configs
  mail_configuration_authority: homelab-dns/msmtp
  watchdog_backend_status: accepted_vendor_systemd_60s_120s
  needrestart_profile: rpi-v8-list-only

application:
  dashboard_url: https://uptime.local.theama.co
  data_directory: /var/lib/uptime-kuma/data
  deployment_manifest: homelab-monitoring-observability/uptime-kuma/manifests/deployment.yaml
  configuration_authority: homelab-monitoring-observability/uptime-kuma
  deployment_status: service_and_dashboard_accepted_20261112
  project_closeout: accepted_kuma_service
  acceptance_record: homelab-monitoring-observability/changes/2026-11-09-uptime-kuma/RESULT.md

notification:
  configuration_authority: homelab-notification/apprise-api
  deployment_status: existing_shared_services_not_selected_for_local_install

component_runtime:
  uptime_kuma: podman
  needrestart: native
  msmtp: native

high_availability:
  role: none
  owns_virtual_ips: false
