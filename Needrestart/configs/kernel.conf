# Install as /etc/needrestart/conf.d/kernel.conf.
# https://github.com/liske/needrestart/blob/master/README.raspberry.md
# This configuration is only for a Raspberry Pi.
# Raspberry Pi systems install multiple kernel variants in parallel, so filter
# the image filenames to the variant that this host boots.
# Verify the kernel variant using `uname -r` and use the appropriate filter.
# rpi8-rpi-v8 (4KB page size; use this on a host booting *-v8)
# $nrconf{kernelfilter} = qr(vmlinuz-.*-v8$);
# rpi8-rpi-2712 (16KB page size; use this on a host booting *-2712)
# $nrconf{kernelfilter} = qr(vmlinuz-.*-2712$);
# Batch mode performs kernel checks. (use 'l' for list-only mode) <fleet standard>
$nrconf{restart} = 'l';
# Disable processor microcode checks. Not supported on ARM architectures. <fleet standard on ARM architectures>
$nrconf{check_microcode} = 0;