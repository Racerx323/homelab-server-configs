---
# Preparation-only entrypoint; exact inventory, bindings and outer deadlines must
# be sealed separately. Never invoke the Caddy owner for this backend question.
- name: Compare bounded native backend concurrency and restore loopback
  hosts: webmin_trial
  become: true
  gather_facts: false
  tags: [comparison-forward]
  tasks:
    - name: Require the narrow backend scope before target contact
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - proxy_trial.primary_ipv4 | bool
          - proxy_trial.paths | length == 1
          - proxy_trial.paths[0].node == 'proxy-a'
          - proxy_trial.paths[0].source == '10.1.0.53'
          - proxy_trial.paths[0].address == '10.1.3.75'
          - proxy_trial.backend_addresses == ['10.1.3.75']
          - proxy_trial.recovery_seconds == 1800
          - comparison.forward_seconds == 240
          - comparison.recovery_seconds == 840
          - comparison.primary_directory is match('^/tmp/webmin-comparison-[a-z0-9]+$')
          - comparison.primary_native_hostname | length > 0
          - comparison.input_manifest | length > 0
      delegate_to: localhost
      become: false
    - name: Verify sealed local source identities
      ansible.builtin.command:
        argv: [/usr/bin/sha256sum, --check, --strict, '{{ comparison.input_manifest }}']
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Admit private controller receipt storage
      ansible.builtin.command:
        argv: [/usr/bin/python3, '{{ fleet_server_root }}/Webmin/scripts/proxy-trial-handoff.py',
               admit-evidence, '{{ operation_evidence_directory }}']
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Verify primary identity without an historical boot pin
      ansible.builtin.command: {argv: [/usr/bin/hostname]}
      delegate_to: proxy-a
      become: false
      register: comparison_primary_identity
      changed_when: false
    - ansible.builtin.assert:
        that: [comparison_primary_identity.stdout == comparison.primary_native_hostname]
    - name: Check the primary route before temporary backend exposure
      ansible.builtin.command:
        argv: [/usr/bin/timeout, 5s, /usr/sbin/ip, -j, -4, route, get, '10.1.3.75']
      delegate_to: proxy-a
      become: false
      register: comparison_primary_route
      changed_when: false
    - name: Require the reviewed IPv4 source
      ansible.builtin.assert:
        that:
          - (comparison_primary_route.stdout | from_json) | length == 1
          - (comparison_primary_route.stdout | from_json)[0].prefsrc | default((comparison_primary_route.stdout | from_json)[0].src | default('')) == '10.1.0.53'
    - name: Admit primary boot continuity
      ansible.builtin.slurp: {src: /proc/sys/kernel/random/boot_id}
      delegate_to: proxy-a
      become: false
      register: comparison_primary_boot
    - name: Admit backend boot continuity
      ansible.builtin.slurp: {src: /proc/sys/kernel/random/boot_id}
      register: comparison_backend_boot
    - name: Refuse reused primary work storage
      ansible.builtin.stat: {path: '{{ comparison.primary_directory }}', follow: false}
      delegate_to: proxy-a
      become: false
      register: comparison_primary_path
    - ansible.builtin.assert:
        that: [not comparison_primary_path.stat.exists]
    - name: Persist admission before any target mutation
      ansible.builtin.copy:
        content: >-
          {{ {'primary_boot': comparison_primary_boot.content,
              'backend_boot': comparison_backend_boot.content} | to_json }}
        dest: '{{ operation_evidence_directory }}/admission.json'
        mode: '0600'
      delegate_to: localhost
      become: false
    - name: Run the backend owner with unconditional restoration
      block:
        - name: Prepare fresh primary client storage
          ansible.builtin.file:
            path: '{{ comparison.primary_directory }}'
            state: directory
            mode: '0700'
          delegate_to: proxy-a
          become: false
          register: comparison_primary_created
        - name: Stage the two current probe components on primary
          ansible.builtin.copy:
            src: '{{ fleet_server_root }}/Webmin/scripts/{{ item }}'
            dest: '{{ comparison.primary_directory }}/{{ item }}'
            mode: '0600'
          delegate_to: proxy-a
          become: false
          loop: [probe-proxy-path.py, compare-backend.py]
        - ansible.builtin.import_tasks: proxy-trial.yaml
        - name: Stage probe components on backend
          ansible.builtin.copy:
            src: '{{ fleet_server_root }}/Webmin/scripts/{{ item }}'
            dest: '{{ proxy_trial.work_directory }}/{{ item }}'
            owner: root
            group: root
            mode: '0600'
          loop: [probe-proxy-path.py, compare-backend.py]
        - name: Stage exact accepted service limits
          ansible.builtin.copy:
            src: '{{ comparison.limits_file }}'
            dest: '{{ proxy_trial.work_directory }}/comparison-limits.json'
            owner: root
            group: root
            mode: '0600'
        - name: Establish healthy quiescent baseline before observation
          ansible.builtin.command:
            argv: [/usr/bin/timeout, --signal=TERM, --kill-after=2s, 15s,
                   /usr/bin/python3, '{{ proxy_trial.work_directory }}/compare-backend.py', gate,
                   --directory, '{{ proxy_trial.work_directory }}', --initialize,
                   --limits, '{{ proxy_trial.work_directory }}/comparison-limits.json']
          changed_when: false
        - name: Start one bounded resource and wire observer
          ansible.builtin.command:
            argv: [/usr/bin/python3, '{{ proxy_trial.work_directory }}/compare-backend.py', observe,
                   --directory, '{{ proxy_trial.work_directory }}',
                   --limits, '{{ proxy_trial.work_directory }}/comparison-limits.json']
          async: 250
          poll: 0
          register: comparison_observer
          changed_when: false
        - name: Require observer readiness
          ansible.builtin.wait_for:
            path: '{{ proxy_trial.work_directory }}/resource-ready'
            timeout: 5
        - name: Execute at most five requests with gating between phases
          ansible.builtin.include_tasks: backend-comparison-phase.yaml
          loop:
            - {name: baseline, count: 1}
            - {name: concurrent, count: 3}
            - {name: recovery-control, count: 1}
          loop_control: {loop_var: comparison_phase}

- name: Recover the backend comparison independently of forward task failure
  hosts: webmin_trial
  become: true
  gather_facts: false
  tags: [comparison-recovery]
  ignore_unreachable: true
  tasks:
    - name: Inspect the controller admission record without target contact
      ansible.builtin.stat:
        path: '{{ operation_evidence_directory }}/admission.json'
      delegate_to: localhost
      become: false
      register: comparison_admission_file
    - name: Recover only an admitted operation
      when: comparison_admission_file.stat.exists
      block:
        - name: Read the admitted boot identities
          ansible.builtin.set_fact:
            comparison_admission: "{{ lookup('file', operation_evidence_directory + '/admission.json') | from_json }}"
        - name: Recheck primary boot before recovery
          ansible.builtin.slurp: {src: /proc/sys/kernel/random/boot_id}
          delegate_to: proxy-a
          become: false
          register: comparison_primary_exit_boot
          ignore_errors: true
          ignore_unreachable: true
        - name: Recheck backend boot before recovery
          ansible.builtin.slurp: {src: /proc/sys/kernel/random/boot_id}
          register: comparison_backend_exit_boot
          ignore_errors: true
          ignore_unreachable: true
        - name: Stop the primary workload before restoring the backend
          block:
            - ansible.builtin.assert:
                that: [comparison_primary_exit_boot.content | default('') == comparison_admission.primary_boot]
            - name: Latch stop and acquire the exclusive client lock
              ansible.builtin.command:
                argv: [/usr/bin/timeout, --signal=TERM, --kill-after=2s, 15s,
                       /usr/bin/python3, '{{ comparison.primary_directory }}/compare-backend.py',
                       stop-clients, --directory, '{{ comparison.primary_directory }}']
              delegate_to: proxy-a
              become: false
              register: comparison_client_stop
              changed_when: true
          rescue:
            - ansible.builtin.set_fact: {comparison_cleanup_failed: true}
          always:
            - name: Restore independently of client-stop or observer failure
              block:
                - ansible.builtin.assert:
                    that: [comparison_backend_exit_boot.content | default('') == comparison_admission.backend_boot]
                - name: Inspect the backend snapshot
                  ansible.builtin.stat: {path: '{{ proxy_trial.work_directory }}/state.json'}
                  register: comparison_state_file
                - name: Finish the observer if it started
                  block:
                    - ansible.builtin.stat: {path: '{{ proxy_trial.work_directory }}/resource-ready'}
                      register: comparison_ready
                    - name: Stop and join observation before restoration
                      when: comparison_ready.stat.exists
                      block:
                        - ansible.builtin.command:
                            argv: [/usr/bin/timeout, --signal=TERM, --kill-after=2s, 8s,
                                   /usr/bin/python3, '{{ proxy_trial.work_directory }}/compare-backend.py',
                                   join-observer, --directory, '{{ proxy_trial.work_directory }}']
                          changed_when: true
                  rescue:
                    - ansible.builtin.set_fact: {comparison_observer_failed: true}
                  always:
                    - name: Restore exact native baseline and verify before timer disarm
                      when: comparison_state_file.stat.exists
                      ansible.builtin.import_tasks: proxy-trial-restore.yaml
              rescue:
                - ansible.builtin.set_fact: {comparison_restore_failed: true}
              always:
                - name: Retrieve evidence after restoration was attempted
                  ansible.builtin.fetch:
                    src: '{{ proxy_trial.work_directory }}/{{ item }}'
                    dest: '{{ operation_evidence_directory }}/backend/{{ item }}'
                    flat: true
                    fail_on_missing: false
                  loop: [state.json, comparison-baseline.json, resource-samples.jsonl,
                         backend-wire.jsonl, comparison-stop, baseline.json, concurrent.json,
                         recovery-control.json, comparison-limits.json, observer-owner.json, observer-exited.json]
                  register: comparison_fetch
                  ignore_errors: true
                - name: Read primary boot after restoration
                  ansible.builtin.slurp: {src: /proc/sys/kernel/random/boot_id}
                  delegate_to: proxy-a
                  become: false
                  register: comparison_primary_final_boot
                  ignore_errors: true
                - name: Read backend boot after restoration
                  ansible.builtin.slurp: {src: /proc/sys/kernel/random/boot_id}
                  register: comparison_backend_final_boot
                  ignore_errors: true
                - name: Evaluate final evidence locally after restoration
                  ansible.builtin.command:
                    argv: [/usr/bin/python3, '{{ fleet_server_root }}/Webmin/scripts/compare-backend.py',
                           terminal, --directory, '{{ operation_evidence_directory }}/backend',
                           --limits, '{{ operation_evidence_directory }}/backend/comparison-limits.json']
                  delegate_to: localhost
                  become: false
                  register: comparison_terminal
                  failed_when: false
                  changed_when: false
                - name: Persist separate cleanup and evidence outcomes
                  ansible.builtin.copy:
                    content: >-
                      {{ {'client_cleanup': comparison_client_stop | default({}),
                          'restoration_failed': comparison_restore_failed | default(false),
                          'restoration_verified': (proxy_trial_terminal is defined and proxy_trial_terminal.content is defined and not (comparison_restore_failed | default(false))),
                          'observer_failed': comparison_observer_failed | default(false),
                          'evidence_status': comparison_terminal.rc,
                          'evidence': comparison_terminal.stdout} | to_json }}
                    dest: '{{ operation_evidence_directory }}/recovery-result.json'
                    mode: '0600'
                  delegate_to: localhost
                  become: false
                - name: Require complete cleanup and evidence acceptance
                  ansible.builtin.assert:
                    that:
                      - not (comparison_cleanup_failed | default(false))
                      - not (comparison_restore_failed | default(false))
                      - not (comparison_observer_failed | default(false))
                      - comparison_client_stop.rc | default(-1) == 0
                      - comparison_primary_final_boot.content | default('') == comparison_admission.primary_boot
                      - comparison_backend_final_boot.content | default('') == comparison_admission.backend_boot
                      - comparison_fetch is succeeded
                      - comparison_terminal.rc == 0
# The primary private directory is retained with its stop latch. Do not remove
# it while a delayed remote dispatch could still refer to it. No clients remain
# after stop-clients succeeds; directory retention is evidence, not active work.
