---
- name: Check health and workload quiescence before this phase
  ansible.builtin.command:
    argv: [/usr/bin/timeout, --signal=TERM, --kill-after=2s, 15s,
           /usr/bin/python3, '{{ proxy_trial.work_directory }}/compare-backend.py', gate,
           --directory, '{{ proxy_trial.work_directory }}',
           --limits, '{{ proxy_trial.work_directory }}/comparison-limits.json']
  changed_when: false
- name: Run one fixed batch with an outer process deadline
  ansible.builtin.command:
    argv: [/usr/bin/timeout, --signal=TERM, --kill-after=2s, 10s,
           /usr/bin/python3, '{{ comparison.primary_directory }}/compare-backend.py', batch,
           --count, '{{ comparison_phase.count | string }}',
           --directory, '{{ comparison.primary_directory }}']
  delegate_to: proxy-a
  become: false
  register: comparison_batch
  changed_when: false
  failed_when: false
- name: Retain safe client outcomes before any assertion
  ansible.builtin.copy:
    content: '{{ comparison_batch.stdout }}'
    dest: '{{ operation_evidence_directory }}/{{ comparison_phase.name }}.json'
    mode: '0600'
  delegate_to: localhost
  become: false
- name: Stage safe client receipt for wire correlation
  ansible.builtin.copy:
    content: '{{ comparison_batch.stdout }}'
    dest: '{{ proxy_trial.work_directory }}/{{ comparison_phase.name }}.json'
    mode: '0600'
- name: Require complete healthy request outcomes or stop for restoration
  ansible.builtin.assert:
    that:
      - comparison_batch.rc == 0
      - (comparison_batch.stdout | from_json).accepted | bool
      - (comparison_batch.stdout | from_json).owned_clients_reaped | bool
- name: Require backend workload completion before any next batch
  ansible.builtin.command:
    argv: [/usr/bin/timeout, --signal=TERM, --kill-after=2s, 15s,
           /usr/bin/python3, '{{ proxy_trial.work_directory }}/compare-backend.py', gate,
           --directory, '{{ proxy_trial.work_directory }}',
           --limits, '{{ proxy_trial.work_directory }}/comparison-limits.json']
  changed_when: false
- name: Require actual backend arrivals and concurrency evidence
  ansible.builtin.command:
    argv: [/usr/bin/python3, '{{ proxy_trial.work_directory }}/compare-backend.py', wire,
           --directory, '{{ proxy_trial.work_directory }}',
           --receipt, '{{ proxy_trial.work_directory }}/{{ comparison_phase.name }}.json']
  changed_when: false
