---
# One reviewed parent: existing backend, Caddy and scan owners retain their work.
# Vars and inventory are private exact-bundle inputs. This file grants no authority.
- name: Qualify temporary Webmin browser exposure and restore both owners
  hosts: webmin_trial
  become: true
  gather_facts: false
  tasks:
    - name: Require one host and the selected owner entrypoints
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - proxy_caddy.argv[0] == '/bin/bash'
          - proxy_caddy.argv[1] == fleet_server_root ~ '/Caddy/scripts/run-serving-health-deployment-outer.sh'
          - proxy_trial.workload_token is match('^[0-9a-f]{64}$')
          - fleet_scan_trial.directory is match('^/run/needrestart-acceptance-[a-z0-9]{16,64}$')
          - proxy_trial.operator_ready | bool
          - proxy_caddy.argv | length == 2
          - "'CADDY_CERTIFICATE_TEST_SCOPE' not in proxy_caddy.environment"
    - name: Bind diagnostic-only work to the Caddy owner aggregate deadline
      when: proxy_trial.diagnostic_only | default(false) | bool
      ansible.builtin.assert:
        that:
          - "'application_diagnostic_seconds\t240' in lookup('ansible.builtin.file', fleet_server_root ~ '/Caddy/manifests/certificate-release-inputs.tsv').splitlines()"
    - name: Require the parent and owner to select the same diagnostic scope
      ansible.builtin.assert:
        that:
          - (proxy_trial.primary_ipv4 | default(false) | bool) == ('application_diagnostic_scope\tprimary-ipv4' in lookup('ansible.builtin.file', fleet_server_root ~ '/Caddy/manifests/certificate-release-inputs.tsv').splitlines())
          - (proxy_trial.diagnostic_frontend_family | default(4)) in [4, 6]
          - (proxy_trial.diagnostic_frontend_family | default(4) == 6) == ('application_diagnostic_frontend_family\t6' in lookup('ansible.builtin.file', fleet_server_root ~ '/Caddy/manifests/certificate-release-inputs.tsv').splitlines())
          - (proxy_trial.diagnostic_frontend_family | default(4) != 6) or (proxy_trial.primary_ipv4 | default(false) | bool)
    - name: Bind the primary-only diagnostic before any target command
      when: proxy_trial.primary_ipv4 | default(false) | bool
      ansible.builtin.assert:
        that:
          - proxy_trial.diagnostic_only | default(false) | bool
          - "'application_diagnostic_scope\tprimary-ipv4' in lookup('ansible.builtin.file', fleet_server_root ~ '/Caddy/manifests/certificate-release-inputs.tsv').splitlines()"
          - (lookup('ansible.builtin.file', proxy_trial.diagnostic_spec) | from_json).scope == 'primary-ipv4'
          - proxy_trial.paths | map(attribute='id') | list == ['a-ipv4']
          - proxy_trial.paths[0].node == 'proxy-a'
          - proxy_trial.paths[0].address == '10.1.3.75'
          - proxy_trial.paths[0].source == '10.1.0.53'
          - proxy_trial.backend_addresses == ['10.1.3.75']
          - (lookup('ansible.builtin.file', proxy_trial.diagnostic_spec) | from_json).clock_ssh_prefixes.keys() | sort | list == ['backend', 'node-a']
    - name: Require Caddy authorization-ready source bindings before backend exposure
      ansible.builtin.command:
        argv: [/bin/bash, '{{ fleet_server_root }}/Caddy/tests/deployable-successor-policy.sh', --authorization-ready]
      environment: '{{ proxy_caddy.environment }}'
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Verify the exact non-secret parent manifest before any mutation
      ansible.builtin.command:
        argv: [/usr/bin/sha256sum, --check, --strict, '{{ proxy_trial.inputs_manifest }}']
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Admit private controller evidence storage before any target contact
      ansible.builtin.command:
        argv: [/usr/bin/python3, '{{ fleet_server_root }}/Webmin/scripts/proxy-trial-handoff.py',
               admit-evidence, '{{ operation_evidence_directory }}']
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Check private client source and installed runtime without launching a browser
      when: not (proxy_trial.diagnostic_only | default(false) | bool)
      ansible.builtin.command:
        argv: '{{ proxy_trial.client_preflight_argv }}'
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Check native host identity without accepting historical boot IDs
      ansible.builtin.command: {argv: [/usr/bin/hostname]}
      register: proxy_trial_hostname
      changed_when: false
    - ansible.builtin.assert:
        that: [proxy_trial_hostname.stdout == proxy_trial.native_hostname]
    - name: Capture this operation's boot identity
      ansible.builtin.slurp: {src: /proc/sys/kernel/random/boot_id}
      register: proxy_trial_boot
    - name: Bind the same reviewed resource profile before any exposure
      ansible.builtin.set_fact:
        proxy_trial_resource: '{{ lookup("ansible.builtin.file", fleet_scan_trial.profile_file) | from_json }}'
    - ansible.builtin.assert:
        that:
          - proxy_trial_resource.workload_token == proxy_trial.workload_token
          - proxy_trial_resource.duration_seconds <= 600
          - proxy_trial_resource.scan_after_seconds <= proxy_trial_resource.duration_seconds - 100
    - name: Read actual service/cgroup controls for the selected units
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, show, '{{ item.key }}', '--property=ActiveState,ControlGroup,MemoryHigh,MemoryMax,MemorySwapMax']
      loop: '{{ proxy_trial_resource.services | dict2items }}'
      register: proxy_trial_service_admission
      changed_when: false
    - name: Reject changed service/cgroup identities and controls before backend mutation
      ansible.builtin.assert:
        that:
          - "'ActiveState=active' in item.stdout_lines"
          - "('ControlGroup=' ~ item.item.value.cgroup) in item.stdout_lines"
          - "('MemoryHigh=' ~ ('infinity' if item.item.value['memory.high'] == 'max' else item.item.value['memory.high'])) in item.stdout_lines"
          - "('MemoryMax=' ~ item.item.value['memory.max']) in item.stdout_lines"
          - "'MemorySwapMax=0' in item.stdout_lines"
      loop: '{{ proxy_trial_service_admission.results }}'
    - name: Run the temporary owner stages
      block:
        - name: Record that backend preparation is entering its owner boundary
          ansible.builtin.set_fact: {proxy_trial_backend_entered: true}
        - ansible.builtin.import_tasks: proxy-trial.yaml
        - name: Stage the existing collector before the diagnostic observation
          ansible.builtin.copy:
            src: '{{ fleet_server_root }}/Webmin/scripts/probe-proxy-path.py'
            dest: '{{ proxy_trial.work_directory }}/probe-proxy-path.py'
            owner: root
            group: root
            mode: '0600'
        - name: Capture bounded pre-operation clock uncertainty on the selected hosts
          when: proxy_trial.diagnostic_only | default(false) | bool
          ansible.builtin.command:
            argv: [/usr/bin/python3, '{{ fleet_server_root }}/Webmin/scripts/proxy-trial-handoff.py', clock,
                   '{{ proxy_trial.diagnostic_spec }}', '{{ operation_evidence_directory }}/clock-before.json']
          delegate_to: localhost
          become: false
          changed_when: false
        - name: Start bounded diagnostic resource sampling before Caddy activation
          when: proxy_trial.diagnostic_only | default(false) | bool
          ansible.builtin.command:
            argv: >-
              {{ ['/usr/bin/python3', proxy_trial.work_directory ~ '/probe-proxy-path.py',
                  '--observe-directory', proxy_trial.work_directory] +
                 (['--wire-peer', proxy_trial.paths[0].source, '--wire-backend', proxy_trial.paths[0].address,
                   '--wire-hostname', proxy_trial.browser_hostname] if proxy_trial.primary_ipv4 | default(false) | bool else []) }}
          async: 310
          poll: 0
          register: proxy_trial_resource_job
          changed_when: false
        - name: Require a usable resource baseline before Caddy activation
          when: proxy_trial.diagnostic_only | default(false) | bool
          ansible.builtin.stat:
            path: '{{ proxy_trial.work_directory }}/resource-ready'
          register: proxy_trial_resource_ready
          until: proxy_trial_resource_ready.stat.exists
          retries: 5
          delay: 1
        - ansible.builtin.import_tasks: proxy-path-trial.yaml
        - name: Start the exact Caddy owner command with private separate logs
          ansible.builtin.shell: |
            umask 077
            set +e
            {{ proxy_caddy.argv | map('quote') | join(' ') }} > {{ (operation_evidence_directory ~ '/caddy.stdout') | quote }} 2> {{ (operation_evidence_directory ~ '/caddy.stderr') | quote }}
            caddy_owner_status=$?
            printf '%s\n' "$caddy_owner_status" > {{ (operation_evidence_directory ~ '/caddy.exit.partial') | quote }}
            mv -- {{ (operation_evidence_directory ~ '/caddy.exit.partial') | quote }} {{ (operation_evidence_directory ~ '/caddy.exit') | quote }}
            exit "$caddy_owner_status"
          args: {executable: /bin/bash}
          environment: '{{ proxy_caddy.environment }}'
          delegate_to: localhost
          become: false
          async: 1200
          poll: 0
          register: proxy_trial_caddy_job
        - name: Wait for the Caddy owner's exact temporary exposure receipt
          when: not (proxy_trial.primary_ipv4 | default(false) | bool)
          ansible.builtin.command:
            argv: [/usr/bin/python3, '{{ fleet_server_root }}/Webmin/scripts/proxy-trial-handoff.py', ready,
                   '{{ operation_evidence_directory }}/caddy.stdout', '{{ operation_evidence_directory }}/caddy-ready.json',
                   --owner-exit, '{{ operation_evidence_directory }}/caddy.exit']
          delegate_to: localhost
          become: false
          register: proxy_trial_caddy_ready
          changed_when: false
          until: proxy_trial_caddy_ready.rc in [0, 2]
          retries: 150
          delay: 2
        - ansible.builtin.assert:
            that: [proxy_trial_caddy_ready.rc == 0]
          when: not (proxy_trial.primary_ipv4 | default(false) | bool)
        - ansible.builtin.set_fact: {proxy_trial_workload_entered: true}
          when: not (proxy_trial.diagnostic_only | default(false) | bool)
        - name: Supervise the single observer and private statistics client
          when: not (proxy_trial.diagnostic_only | default(false) | bool)
          ansible.builtin.command:
            argv: [/usr/bin/python3, '{{ fleet_server_root }}/Webmin/scripts/supervise-proxy-workload.py',
                   --spec, '{{ proxy_trial.workload_spec }}']
            stdin: '{{ lookup("ansible.builtin.file", proxy_trial.credentials_file) }}'
            stdin_add_newline: false
          delegate_to: localhost
          become: false
          no_log: true
          register: proxy_trial_workload
          failed_when: false
        - name: Require browser, path and resource acceptance before a passing verdict
          when: not (proxy_trial.diagnostic_only | default(false) | bool)
          ansible.builtin.assert:
            that: [proxy_trial_workload.rc == 0]
      always:
        - name: Signal the existing Caddy owner only after workload child cleanup
          ansible.builtin.command:
            argv: >-
              {{ ['/usr/bin/python3', fleet_server_root ~ '/Webmin/scripts/proxy-trial-handoff.py',
                  'finish', operation_evidence_directory ~ '/caddy-ready.json']
                 + (['--workload-result', proxy_trial.workload_result]
                    if proxy_trial_workload_entered | default(false) else []) }}
          delegate_to: localhost
          become: false
          when: proxy_trial_caddy_ready is defined and proxy_trial_caddy_ready.get("rc", 1) == 0
          register: proxy_trial_caddy_finish
          failed_when: false
        - name: Retain the Caddy restoration result without suppressing backend recovery
          ansible.builtin.async_status:
            jid: '{{ proxy_trial_caddy_job.ansible_job_id }}'
          delegate_to: localhost
          become: false
          when: proxy_trial_caddy_job is defined and proxy_trial_caddy_job.ansible_job_id is defined
          register: proxy_trial_caddy_terminal
          until: proxy_trial_caddy_terminal.finished | default(false)
          retries: 900
          delay: 1
          failed_when: false
          ignore_errors: true
        - name: Finish diagnostic sampling and retain its bounded event intervals
          when: proxy_trial_resource_job is defined and proxy_trial_resource_job.ansible_job_id is defined
          block:
            - ansible.builtin.copy:
                content: 'stop'
                dest: '{{ proxy_trial.work_directory }}/resource-stop'
                mode: '0600'
            - ansible.builtin.async_status:
                jid: '{{ proxy_trial_resource_job.ansible_job_id }}'
              register: proxy_trial_resource_terminal
              until: proxy_trial_resource_terminal.finished | default(false)
              retries: 5
              delay: 1
              failed_when: false
            - ansible.builtin.fetch:
                src: '{{ proxy_trial.work_directory }}/resource-samples.jsonl'
                dest: '{{ operation_evidence_directory }}/backend-resource-samples.jsonl'
                flat: true
            - ansible.builtin.file:
                path: '{{ operation_evidence_directory }}/backend-resource-samples.jsonl'
                mode: '0600'
              delegate_to: localhost
              become: false
            - name: Retain bounded backend wire evidence for the primary diagnostic
              when: proxy_trial.primary_ipv4 | default(false) | bool
              ansible.builtin.fetch:
                src: '{{ proxy_trial.work_directory }}/backend-wire.jsonl'
                dest: '{{ operation_evidence_directory }}/backend-wire.jsonl'
                flat: true
            - name: Protect the retained wire receipt
              when: proxy_trial.primary_ipv4 | default(false) | bool
              ansible.builtin.file:
                path: '{{ operation_evidence_directory }}/backend-wire.jsonl'
                mode: '0600'
              delegate_to: localhost
              become: false
            - ansible.builtin.assert:
                that:
                  - proxy_trial_resource_terminal.finished
                  - proxy_trial_resource_terminal.rc == 0
          rescue:
            - ansible.builtin.debug:
                msg: Diagnostic resource evidence incomplete; retain failure and continue mandatory restoration.
        - name: Retain clock and resource coverage independently of owner restoration
          when: proxy_trial_resource_job is defined and proxy_trial_resource_job.ansible_job_id is defined
          block:
            - name: Capture bounded post-operation clock uncertainty
              ansible.builtin.command:
                argv: [/usr/bin/python3, '{{ fleet_server_root }}/Webmin/scripts/proxy-trial-handoff.py', clock,
                       '{{ proxy_trial.diagnostic_spec }}', '{{ operation_evidence_directory }}/clock-after.json']
              delegate_to: localhost
              become: false
              changed_when: false
            - name: Require request coverage within the observed resource interval
              when: proxy_trial_caddy_job is defined and proxy_trial_caddy_job.ansible_job_id is defined
              ansible.builtin.command:
                argv: [/usr/bin/python3, '{{ fleet_server_root }}/Webmin/scripts/proxy-trial-handoff.py', diagnostic-coverage,
                       '{{ operation_evidence_directory }}/clock-before.json', '{{ operation_evidence_directory }}/diagnostic-coverage.json',
                       --after, '{{ operation_evidence_directory }}/clock-after.json',
                       --samples, '{{ operation_evidence_directory }}/backend-resource-samples.jsonl',
                       --requests, '{{ operation_evidence_directory }}/caddy.stdout', --owner-log, --frontend-family, '{{ proxy_trial.diagnostic_frontend_family | default(4) }}']
              delegate_to: localhost
              become: false
              changed_when: false
              register: proxy_trial_diagnostic_coverage
            - name: Classify a pre-Caddy exit without opening absent proxy evidence
              when: proxy_trial_caddy_job is not defined or proxy_trial_caddy_job.ansible_job_id is not defined
              ansible.builtin.set_fact:
                proxy_trial_diagnostic_coverage:
                  coverage_accepted: false
                  proxy_request: not-run
                  reason: caddy-not-started
            - name: Retain the explicit not-run comparison result
              when: proxy_trial_caddy_job is not defined or proxy_trial_caddy_job.ansible_job_id is not defined
              ansible.builtin.copy:
                content: '{{ proxy_trial_diagnostic_coverage | to_nice_json }}'
                dest: '{{ operation_evidence_directory }}/diagnostic-coverage.json'
                mode: '0600'
              delegate_to: localhost
              become: false
          rescue:
            - ansible.builtin.debug:
                msg: Diagnostic correlation incomplete; retain unknown result and continue mandatory backend restoration.
        - name: Retain bounded backend resource evidence before native restoration
          when: proxy_trial_backend_entered | default(false)
          block:
            - ansible.builtin.command:
                argv: [/usr/bin/timeout, '3', /usr/bin/python3, '{{ proxy_trial.work_directory }}/probe-proxy-path.py', --snapshot]
              changed_when: false
              failed_when: false
              register: proxy_trial_failure_snapshot
            - ansible.builtin.copy:
                content: '{{ proxy_trial_failure_snapshot | to_nice_json }}'
                dest: '{{ operation_evidence_directory }}/backend-before-restoration.json'
                mode: '0600'
              delegate_to: localhost
              become: false
          rescue:
            - ansible.builtin.debug:
                msg: Backend evidence unavailable; continue mandatory restoration.
        - name: Restore the native backend even if paired Caddy restoration is incomplete
          when: proxy_trial_backend_entered | default(false)
          block:
            - ansible.builtin.import_tasks: proxy-trial-restore.yaml
          always:
            - name: Retain independent owner outcomes without private login data
              ansible.builtin.copy:
                content: >-
                  {{ {'caddy': proxy_trial_caddy_terminal | default({'not_started': true}),
                      'workload_exit': (proxy_trial_workload | default({})).get('rc'),
                      'caddy_finish': (proxy_trial_caddy_finish | default({})).get('rc'),
                      'diagnostic_coverage': proxy_trial_diagnostic_coverage | default({'not_started': true}),
                      'resource_observer': proxy_trial_resource_terminal | default({'not_started': true})} | to_nice_json }}
                dest: '{{ operation_evidence_directory }}/parent-owner-outcomes.json'
                mode: '0600'
              delegate_to: localhost
              become: false
    - name: Require paired Caddy completion and unchanged boot continuity
      block:
        - ansible.builtin.slurp: {src: /proc/sys/kernel/random/boot_id}
          register: proxy_trial_boot_after
        - ansible.builtin.assert:
            that:
              - proxy_trial_boot_after.content == proxy_trial_boot.content
              - proxy_trial_caddy_terminal.finished
              - proxy_trial_caddy_terminal.rc == 0
              - (proxy_trial.primary_ipv4 | default(false) | bool) or proxy_trial_caddy_finish.rc == 0
              - not (proxy_trial.diagnostic_only | default(false) | bool) or (proxy_trial_diagnostic_coverage | default({})).get("rc", 1) == 0
              - not (proxy_trial.diagnostic_only | default(false) | bool) or (proxy_trial_resource_terminal.finished and proxy_trial_resource_terminal.rc == 0)
              - (proxy_trial.diagnostic_only | default(false) | bool) or proxy_trial_workload.rc == 0
