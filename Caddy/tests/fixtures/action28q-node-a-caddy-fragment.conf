vrrp_script check_caddy {
    script "/usr/local/libexec/check-caddy.sh"
    interval 2
    timeout 4
    rise 3
    fall 3
    user keepalived_script caddy-tls
}

vrrp_sync_group CADDY_DUALSTACK {
    group {
        CADDY_IPV4
        CADDY_IPV6
    }
    track_script {
        check_caddy
    }
    notify "/usr/local/libexec/lsyncd-ha-failover-notify.sh"
}

vrrp_instance CADDY_IPV4 {
    state BACKUP
    interface eth0
    virtual_router_id 110
    priority 150
    advert_int 1
    preempt_delay 30
    version 3

    unicast_src_ip 10.1.0.53
    unicast_ttl 255
    track_src_ip
    check_unicast_src
    unicast_peer {
        10.1.0.54 min_ttl 255 max_ttl 255
    }

    virtual_ipaddress {
        10.1.0.56/22 dev eth0
    }
}

vrrp_instance CADDY_IPV6 {
    state BACKUP
    interface eth0
    virtual_router_id 111
    priority 150
    advert_int 1
    preempt_delay 30
    version 3

    unicast_src_ip fd36:5aa8:6971:1::53
    unicast_ttl 255
    track_src_ip
    check_unicast_src
    unicast_peer {
        fd36:5aa8:6971:1::54 min_ttl 255 max_ttl 255
    }

    virtual_ipaddress {
        fd36:5aa8:6971:1::56/128 dev eth0 preferred_lft forever
    }
}
