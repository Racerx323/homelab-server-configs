[Service]
EnvironmentFile=/etc/default/caddy-ha
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /etc/caddy/current/Caddyfile --adapter caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/current/Caddyfile --adapter caddyfile --force
Restart=on-failure
RestartSec=5s
TimeoutStopSec=30s
