---
platform:
  os: Debian
  version: "12"
  architecture: arm64

packages:
  caddy:
    source: official_caddy_apt_repository
    names:
      - caddy
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
  availability:
    source: debian_bookworm
    names:
      - keepalived
      - lsyncd
      - rsync
      - openssh-client
      - openssh-server
  validation:
    source: debian_bookworm
    names:
      - bash
      - coreutils
      - findutils
      - iproute2
      - iputils-arping
      - jq
      - ndisc6
      - openssl
      - procps
      - tcpdump
      - util-linux
      - uuid-runtime
  secrets:
    scope: operator_workstation_only
    source: official_doppler_apt_repository
    names:
      - doppler
  existing_pihole_ui:
    source: existing_installation
    names:
      - lighttpd
      - php-cgi
  repository_validation:
    source: operator_workstation
    names:
      - podman
      - pre-commit
      - shellcheck
      - shfmt
      - yamllint
      - markdownlint
      - gitleaks

commands:
  required:
    - caddy
    - curl
    - flock
    - ip
    - jq
    - keepalived
    - logger
    - lsyncd
    - openssl
    - rsync
    - ssh
    - systemctl
    - uuidgen
  operator_workstation_required:
    - doppler
