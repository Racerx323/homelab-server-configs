---
protocol: caddy-ha-release-v2
status: deployed_active_accepted
transport:
  account: caddy-sync
  forced_command: /usr/local/libexec/caddy-sync-release-receiver-v2
  forced_command_source_role: peer-role
  remote_delete: false
  transmitted_completion_marker: false
  excluded_paths:
    - .complete
  receiver_scope: peer-source-role
  lsyncd_mode: default.rsync
  standalone_remote_ssh_operations: prohibited
  protect_args: false
publication:
  atomic_outbound_visibility: true
  normal_source_role: node-a
  emergency_source_role: node-b
  emergency_requires:
    - PIHOLE_IPV4_MASTER
    - PIHOLE_IPV6_MASTER
  request_marker: .finalize-request
  request_marker_constraints:
    type: regular
    size_bytes: 0
  manifest_excludes:
    - manifest.sha256
    - .finalize-request
    - .complete
    - .complete.pending
receiver_finalization:
  identity: caddy-sync
  validation_precedes_marker: true
  validates:
    - source-role
    - revision
    - parent-revision-shape
    - regular-files-only
    - no-symbolic-links
    - no-extra-payload
    - manifest-path-safety
    - manifest-hashes
    - certificate-parsing
    - private-key-parsing
    - certificate-private-key-match
    - caddy-configuration
  locally_created_marker: .complete
  pending_marker: .complete.pending
  final_directory_mode: "0550"
  final_file_mode: "0440"
  idempotent: true
  reconciliation_signal: /var/lib/caddy-sync/incoming/.reconcile-trigger
reconciliation:
  requires:
    - .finalize-request
    - .complete
  rejects:
    - .complete.pending
    - hidden-release-directories
    - unsafe-manifest-paths
    - extra-payload
    - divergent-parent
  conflict_action: quarantine
  candidate_order:
    - exact-active-replay
    - exactly-one-child-of-active
  candidate_ambiguity: fail-closed
  accepted_candidate_disposition: remove-from-incoming
  queue_processing: drain-to-empty
  service_reload_only_after_validation: true
  trigger_path: /var/lib/caddy-sync/incoming/.reconcile-trigger
  destination_visibility: staged_then_atomic
  existing_destination_requires_exact_payload: true
  reload_failure_restores_previous_selection: true
failure_notification:
  owner: systemd-on-failure
  worker_behavior: emit-reason-and-fail
  direct-worker-delivery: prohibited
deployment:
  live_state_changed: true
  authorization_template:
    repository: homelab-server-configs
    path: Caddy/templates/authorized-key-receiver-finalized-v2.in
  accepted_actions:
    - 28ah
    - 29k
    - 30e
