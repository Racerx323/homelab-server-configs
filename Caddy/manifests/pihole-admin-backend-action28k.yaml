---
action: 28k
status: architecture_defined_not_executable
type: protected_shared_pihole_backend_architecture_correction
defined_at: "2026-08-09"

service_contract:
  shared_fqdn: pihole-admin.local.theama.co
  shared_frontend_ipv4: 10.1.0.56
  shared_frontend_ipv6: fd36:5aa8:6971:1::56
  backend_owner_ipv4: 10.1.0.55
  backend_owner_ipv6: fd36:5aa8:6971:1::55
  backend_port: 8443
  backend_tls_name: pihole-backend.local.theama.co
  node_a_fqdn: pihole0.local.theama.co
  node_b_fqdn: pihole00.local.theama.co

architecture:
  shared_route: >-
    The active Caddy frontend proxies the shared Pi-hole administration name
    to the dual-stack DNS VIP, so normal IP ownership selects the DNS MASTER
    independently of Caddy VRRP ownership.
  node_specific_routes: >-
    Each node-specific administration name continues to proxy only that
    node's 127.0.0.1:8080 lighttpd listener.
  backend_service: >-
    A separate caddy-pihole-backend.service runs independently of the frontend
    caddy.service and binds only the IPv4 and IPv6 DNS VIP addresses on TCP
    8443. Existing ip_nonlocal_bind permits the inactive node to start the
    service without acquiring either DNS VIP.
  owner_selection: >-
    The IPv4 DNS VIP is the deterministic primary upstream and the IPv6 DNS
    VIP is the bounded fallback. Acceptance requires both VIPs to have one
    identical owner before the shared route is enabled.
  raw_lighttpd_exposure: prohibited
  lighttpd_listener: 127.0.0.1:8080

protection:
  transport: tls_with_required_mutual_authentication
  server_identity:
    san: pihole-backend.local.theama.co
    dedicated_ca_required: true
    permitted_identities:
      - node-a-pihole-backend
      - node-b-pihole-backend
    per_node_private_keys_required: true
    canonical_der_sha256_pins_required: true
    spki_sha256_pins_required: true
  client_identity:
    dedicated_client_ca_required: true
    permitted_identities:
      - node-a-caddy-frontend
      - node-b-caddy-frontend
    canonical_der_sha256_pins_required: true
    spki_sha256_pins_required: true
    unrelated_client_rejected: true
    unauthenticated_client_rejected: true
  private_keys:
    repository_storage: prohibited
    runtime_owner: root
    runtime_group: caddy-tls
    runtime_mode: "0640"
  listener_scope:
    addresses:
      - 10.1.0.55
      - fd36:5aa8:6971:1::55
    physical_node_addresses: prohibited
    wildcard_addresses: prohibited

deployment_boundaries:
  - Issue and independently pin the dedicated server and client identities.
  - Install and accept the inactive backend service on Node B, then Node A.
  - Start and accept both protected backends without changing the frontend route.
  - Prove mTLS access through each DNS VIP family and rejection without a client identity.
  - Install the frontend route on the Caddy BACKUP node, accept it, then fail over.
  - Install the frontend route on the other node and independently accept failback.
  - Accept shared backend identity as the current DNS VIP owner through IPv4 and IPv6.

acceptance:
  every_assertion_independently_labeled: true
  both_dns_address_queries_must_succeed: true
  exact_one_ipv4_dns_vip_owner: true
  exact_one_ipv6_dns_vip_owner: true
  dns_vip_owner_must_match_across_families: true
  shared_ui_hostname_must_equal_dns_owner_hostname: true
  node_a_ui_hostname_must_equal_node_a: true
  node_b_ui_hostname_must_equal_node_b: true
  shared_route_trusted_tls_required: true
  backend_mtls_required: true
  backend_direct_unauthenticated_rejection_required: true
  lighttpd_loopback_only_required: true
  physical_address_backend_listener_absence_required: true
  before_after_dns_and_caddy_continuity_required: true
  bounded_safe_stdout_and_stderr_required: true

current_authorization:
  architecture_definition_only: true
  credential_issuance: false
  node_contact: false
  backend_installation: false
  backend_start: false
  frontend_route_installation: false
  firewall_change: false
  caddy_failback: false
  execution: false

next_gate:
  authorization: definition_only
  description: >-
    Define the dedicated mTLS identity issuance and pinning prerequisite. No
    backend installation or frontend route change is eligible until the exact
    certificate identities and protected runtime paths are accepted.

artifacts:
  backend_caddyfile: Caddy/templates/pihole-admin-backend.Caddyfile.in
  frontend_route: Caddy/templates/pihole-admin-dns-owner.caddy.in
  backend_service: Caddy/systemd/caddy-pihole-backend.service
