deployment_order:
  - phase: 1_node_b_transaction_definition
    mutation: separately_authorized
    requirements:
      - Install only the exact Node B source candidate.
      - Preserve the retained inactive separate Caddy fragment.
      - Reload only Node B while it is DNS BACKUP.
      - Require one advertised DNS address per family before and after reload.
      - Require Node B to own zero shared VIPs and remain IPv4/IPv6 Backup.
      - Require Node A to remain Master with only the two DNS VIPs.
  - phase: 2_node_b_independent_acceptance
    mutation: false
    requirements:
      - Reprove exact main hash, inactive fragment, TTL policy, and role.
      - Reject any unexpected-address-count or TTL/HL journal entry.
  - phase: 3_node_a_transaction_definition
    mutation: separately_authorized
    requirements:
      - Consume the accepted Node B phase as the immutable baseline.
      - Install only the exact Node A source candidate and reload only Node A.
      - Require Node A to own all four DNS and Caddy VIPs after convergence.
      - Require Node B to remain Backup with zero shared VIPs.
  - phase: 4_dual_node_independent_acceptance
    mutation: false
    requirements:
      - Require one advertised DNS address per family on both peers.
      - Require the Caddy VIP in virtual_ipaddress_excluded on both peers.
      - Prove exact single ownership of all four shared VIPs.
      - Prove shared administration identifies the DNS VIP owner.

rollback:
  node_b_phase_failure: >-
    Restore only Node B's accepted Action 28r-a main, reload only Node B, and
    prove Node B is Backup with zero shared VIPs while Node A retains both DNS
    VIPs. Return 125 if recovery cannot be proven.
  node_a_phase_failure: >-
    Restore only Node A's accepted Action 28r-a main, reload only Node A, and
    prove the accepted DNS-only ownership boundary. Leave accepted Node B
    unchanged. Return 125 if recovery cannot be proven.
  simultaneous_reload: prohibited

evidence:
  ssh_capture_root: /tmp/caddy-ssh-evidence
  stdout_stderr_status_retained_during_original_action: true
  bounded_safe_content_emitted_during_original_action: true
  every_assertion_independently_labeled: true

authorization:
