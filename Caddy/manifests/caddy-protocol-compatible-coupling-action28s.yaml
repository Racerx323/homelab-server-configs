accepted_baseline:
  action: 28r-a
  node_a_main_sha256: 6162cfb9d83f7e524db1df6a3b041ced90a7639fceaf28eacf713270c2a66a65
  node_b_main_sha256: 9aa36b630f304bab674e31af96d96a1dbafb330728b01e2d8216c8dbab2df148
  advertised_ipv4_addresses_per_peer: 1
  advertised_ipv6_addresses_per_peer: 1
  separate_caddy_fragments: retained_inactive

correction:
  owner: PIHOLE_DUALSTACK
  caddy_follows_dns_only: true
  separate_caddy_vrrp_activation: prohibited
  advertised_addresses:
    ipv4:
      - 10.1.0.55/22 dev eth0
    ipv6:
      - fd36:5aa8:6971:1::55/128 dev eth0 preferred_lft forever
  excluded_from_advertisements_but_state_managed:
    ipv4:
      - 10.1.0.56/22 dev eth0
    ipv6:
      - fd36:5aa8:6971:1::56/128 dev eth0 preferred_lft forever
  invariant: >-
    Every live and candidate peer advertises exactly one address per family
    throughout the standby-first deployment. The Caddy VIP is installed and
    removed with the owning DNS instance through virtual_ipaddress_excluded,
    but is never added to the VRRP advertisement payload.

unicast_ttl_contract:
  required: true
  outgoing_per_instance: unicast_ttl 255
  incoming_per_peer: min_ttl 255 max_ttl 255
  instances_per_node:
    - PIHOLE_IPV4
    - PIHOLE_IPV6
  rationale: >-
    unicast_ttl controls transmitted IPv4 TTL or IPv6 hop limit. The peer
    min_ttl and max_ttl bounds validate received advertisements. Keeping the
    receiver bounds without the sender setting recreates the observed TTL/HL
    64 rejection.

