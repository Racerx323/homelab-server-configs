  - Any required endpoint moves outside the Default LAN routed subnet.
  - Switch ACLs, client isolation, or private-VLAN behavior is enabled.
  - WAN port forwarding or UPnP is enabled.
  - A host firewall is enabled on either Caddy node.
  - The Default LAN IPv4 prefix or IPv6 on-link prefix changes.

