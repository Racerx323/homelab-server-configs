decision:
  controller_rule_groups_required: false
  controller_mutation_authorized: false
  execution_runner_required: false
  rationale:
    - All required endpoints are in 10.1.0.0/22 on Default LAN VLAN 1.
    - Required IPv6 endpoints are on the same Default LAN VLAN 1 segment.
    - Same-VLAN traffic does not traverse the gateway zone firewall.
    - Existing policy rejects unrequested IoT-to-Default and Guest access.
    - Existing External-to-Internal policy provides no user-defined ingress allow.
    - No switch ACL rules, WAN port forwards, or UPnP exposure were observed.

accepted_evidence:
  - action: 4c
    observation: >-
      Default LAN, IoT, and Guest zone policy ordering was collected without
      truncation; IoT-to-Default new traffic is rejected and no user-defined
      External-to-Internal ingress allow was present.
  - action: 4d
    observation: Switch ACL count and totalCount were both zero.
  - action: 4e
    observation: >-
      Operator inspection found zero port-forward rules, ISP on WAN1, and UPnP
      disabled.
  - action: 20p-a-retry
    observation: >-
      Dual-stack Caddy VIP ownership, node management endpoints, DBus roles,
      and HTTPS continuity passed without a firewall change.

