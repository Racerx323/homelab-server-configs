implementation:
  lifecycle: neutral-reusable
  copy_per_action: prohibited
targets:
  - pi@10.1.0.53
  - pi@10.1.0.54
mutation:
  - stage one protected temporary payload on each node
  - run the pinned candidate publisher from the payload without replacing installed tools
  - append only the bound Kuma fragment and preserve complete parent TLS and unrelated routes
  - activate and verify Node A before exposing the same original-parent revision to managed replication
  - independently validate and activate Node B through existing finalization and reconciliation
acceptance:
  - exact parent and immutable release integrity; accepted installed finalizer and reconciler identities
  - trusted IPv4 and IPv6 new-route and existing health-route responses on both nodes
  - matching final release manifests and trusted shared-endpoint responses
  - at most sixty one-second secondary convergence polls; each HTTP request bounded to five seconds
  - checked evidence readback and staging disposition; private login and WebSockets remain separate
recovery:
  - primary failure before exposure restores and verifies its preserved parent when mutation is known
  - secondary post-selection failure restores its preserved parent when mutation is known
  - secondary rejection or timeout does not reverse verified primary service; report partial and stop DNS progression
  - final-check failure stops progression; no automatic cross-node rollback or replay
  - uncertain mutation, lost evidence or unproved local recovery requires manual intervention
excluded:
  - DNS, backend changes, reboot, forced failover, certificate replacement and installed-tool replacement
  - account reset, monitors, alerts, synthetic notifications, platform monitor cycles and timed human receipts
  - unrelated route or radio ownership changes and Git publication
live_execution: requires-exact-outer-sha256-approval
