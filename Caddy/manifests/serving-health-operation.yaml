  response and primary recovery timing.
recovery:
- restore original callers before removing the temporary helper, including failure
  before a release ID
- contain the unexposed child on the primary; quiesce and restore its exact original
  selection and outbound inventory
- resume primary transport and observe fresh natural monitor cycles before readback
- report 125 if recovery or monitor acceptance is unproved; do not replay
- native Webmin loopback restoration remains independently governed by the parent
  and 1800-second timer
excluded:
- DNS, reboot, forced failover, certificate replacement and unrelated installed-tool
  replacement
- backend mutation outside the separately bound Webmin parent
- account creation, ACL changes, terminals, monitors, alerts and synthetic notifications
- unrelated route or radio changes and Git publication
- secondary SSH/upload/admission/activation/recovery, release exposure and replication
