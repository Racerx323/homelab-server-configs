mutation:
- Prepare the accepted parent plus the single Webmin SSH-forward fragment on Node A.
- Verify the installed primary validator before preparation. Keep both forward services and all installed callers.
- Activate Node A, verify its route, then expose the exact revision to managed replication.
- Send only control metadata to Node B. Verify replicated selection, manifest and routes.
acceptance:
- Retain existing TLS and unrelated routes. Require HTTP 200 for the login page on both nodes and the VIP over IPv4 and IPv6.
- Keep both accepted selections. Operator login and DNS are separate.
recovery:
- Before exposure restore a mutated primary selection to its verified parent. If exposure is uncertain stop for reconciliation.
- Restore a known failed secondary selection locally. Retain an accepted primary on secondary rejection or timeout.
- On partial convergence, shared endpoint failure or missing readback stop progression. Report each known selection and reserve any cross-node withdrawal for owner review.
- Preserve existing SSH forwards and validator throughout. No automatic replay.
excluded:
- DNS changes, Pi changes, credential collection, browser workload, forced failover, certificate changes and Git publication.
