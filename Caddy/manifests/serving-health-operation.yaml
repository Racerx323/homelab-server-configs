- retain direct/proxy request markers, backend-interface header comparisons and native
  timestamps
- retain bounded resource intervals and possible marked health-probe overlap without
  causal attribution
- one 240-second forward budget; recovery and readback share the unchanged aggregate
  840-second cutoff
- no application acceptance claim; restore after either probe result
