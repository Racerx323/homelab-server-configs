sequence:
  - Upload only the pinned publisher and non-secret recipe; verify both baselines and namespaces.
  - Install the publisher guard on Node B.
  - Publish from Node A using the uploaded candidate publisher without changing Node A serving state or installed publisher.
  - Accept Node B through the real certificate service, IPv4 and IPv6 serving probes, ownership samples, and cursor-bounded journals.
  - Verify Node B evidence on the workstation before changing Node A.
  - Install the publisher guard on Node A and activate the same release through finalization and reconciliation.
  - Accept Node A, compare selected manifest hashes, read back evidence, and remove temporary payloads.
rollback:
  - Before publication, restore only any changed publisher scripts and prove the serving baseline is unchanged.
  - After publication, stop the Node A sender and verify its process group is stopped before removing the exact new outbound entry.
  - Restore Node A then Node B; remove only the target incoming candidate and staging path.
  - Reload Caddy only where selection changed; restore the prior publisher bytes and verify serving and ownership.
  - Resume the Node A sender only after both restorations are proven.
  - Unknown publication state or unproven restoration returns 125 and retains evidence for manual intervention.
  - The rollback baseline retains its known missing-leaf monitoring defect; rollback is not certificate recovery.
boundaries:
  - Preserve current Caddy configuration, fullchain and private key byte-for-byte.
  - Restore leaf.pem, intermediates.pem and certificate-manifest.json from the verified prior immutable release.
  - No DNS, Keepalived, Pi-hole, lighttpd, passwords, VIP manipulation, certificate renewal or key transfer to the workstation.
  - No Caddy restart; configuration activation and rollback use reload.
  - Successful publication remains retained on Node A; completed releases remain immutable.
