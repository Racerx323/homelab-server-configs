mutation:
  - stage one protected payload and retain original release inventories on both nodes
  - use the pinned payload publisher without replacing installed tools
  - append only the bound Webmin fragment while preserving Kuma, unrelated routes and TLS
  - verify primary activation before exposing the exact release to managed replication
  - independently validate and activate the same candidate on the secondary
  - allow one bounded temporary exposure for the separately bound parent workload
acceptance:
  - fresh operation boot continuity and exact original release and installed runtime identities
  - trusted dual-stack new-route and existing health-route responses on both nodes and VIPs
  - bounded secondary convergence through the existing owner path
  - end exposure immediately on diagnostic readiness or forward expiry; retain the 660-second backstop
  - use one 240-second forward deadline and aggregate 840-second recovery cutoff without renewal
  - retain marked upstream timing, request indices, and safe bounded failure evidence before recovery
  - prove paired original selections and outgoing inventories restored before transport resumes
  - diagnostic parent sends finish immediately after route readiness; no browser or scan acceptance
recovery:
  - contain the exact child on both nodes and stop managed transport and reconciliation
  - quiesce receivers, restore secondary then primary, verify inventories, then resume transport
  - retain guarded partial state and report 125 when paired restoration is unproved
  - observe fresh natural monitor cycles after both resumes, retaining independent readbacks
  - exhausted recovery budget or missing receipts requires manual intervention; timeout does not prove quiescence
  - controller loss may require manual Caddy recovery; native Webmin deadline recovery is independent
excluded:
  - DNS, reboot, forced failover, certificate replacement and installed-tool replacement
  - backend mutation outside the separately bound Webmin parent
  - account creation, ACL changes, terminals, monitors, alerts and synthetic notifications
  - unrelated route or radio changes and Git publication
live_execution: requires-exact-outer-sha256-approval-with-combined-parent
