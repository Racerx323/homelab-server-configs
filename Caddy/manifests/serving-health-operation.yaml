notification_acceptance:
  outage_states:
    - failure-retained
    - enqueue-failure-pending
  pending_completion: restoration must enqueue exactly one retained failure and one recovery for the episode
  delivery: non-blocking and outside serving-health decisions
continuity_evidence:
  granularity: one causal record per request and address family
  settled_ownership: every failed primary rejects
  induced_convergence: a failed shared request is accepted only when the same endpoint and family succeeds within 12 seconds and a timestamped kernel address event proves a VIP transition between failure and recovery
  expected_local_outages:
    - affected-node node-specific UI while that node's Caddy service is deliberately stopped
    - affected-node and shared UI while lighttpd is deliberately stopped, with no VIP movement
  retry: evidence only and never a broad waiver
  rejection_classes:
    - missing-or-late-recovery
    - missing-transition-evidence
    - settled-owner-serving-failure
    - family-degraded
    - simultaneous-or-ambiguous-ownership
    - unclassified-insufficient-evidence
  fields: role, scenario, sequence, family, endpoint, port, attempt, start, end, status, result, timings, addresses, sanitized error, VRRP states, and VIP count
  address_monitor: timestamped kernel events on both nodes for the complete exercise window
  correlation: workstation outer validates and correlates both node readbacks
  unsafe_evidence: missing, malformed, duplicate, reordered, oversized, symlinked, incomplete, or uncorrelatable evidence rejects
  lifecycle: sampler and observer terminate children promptly on SIGTERM, use bounded SIGKILL escalation, and leave zero residue
acceptance:
  - uses only the neutral reusable transaction and outer runner
  - changes no repository or node configuration artifact
  - stops no service on both nodes simultaneously
  - requires two failed probes before coupled failover and three healthy probes before recovery
  - requires exact four-VIP ownership with no simultaneous settled ownership
  - lighttpd failure is notification-only, produces one failure and one recovery without VIP movement, and proves UI recovery before the next scenario
  - current structured notifications are retained and the legacy title is absent
  - every stopped service is restored before the next scenario
  - reverse restoration is attempted after every failed mutation boundary
  - every deliberate stop has a bounded automatic restoration watchdog
  - status 125 is reserved for recovery that cannot be proven after mutation
  - final state exactly matches the accepted baseline with zero exercise residue
excluded:
  - transient single-sample scenarios that cannot deterministically remain below the failover threshold
  - interface, SSH, reboot, and whole-node failures already accepted by Action 33
  - installation, publication, synchronization, release, or ownership-policy changes
  - synthetic production results or marker-only acceptance
follow_on:
  result: complete operator documentation and LikeC4 work only after separately authorized execution is accepted
