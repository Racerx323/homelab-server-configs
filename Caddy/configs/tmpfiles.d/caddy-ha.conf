# Caddy HA runtime state. Recreated by systemd-tmpfiles during boot.
d /run/caddy-ha 0750 pi caddy-sync -
d /run/caddy-apprise 0700 pi pi -
d /run/caddy-serving-health 0755 root root -
d /run/caddy-serving-health/dns 0755 pi pi -
d /run/caddy-serving-health/proxy 0755 keepalived_script keepalived_script -
d /run/caddy-serving-health/keepalived 0755 root root -
d /var/lib/caddy-apprise-queue 0700 pi pi -
d /var/lib/caddy-apprise-queue/pending 0700 pi pi -
d /var/lib/caddy-apprise-queue/inflight 0700 pi pi -
d /var/lib/caddy-apprise-queue/dead-letter 0700 pi pi -
d /var/lib/caddy-apprise-queue/delivered 0700 pi pi -
